<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171716"><title>KMB · Stock Control</title><link rel="icon" href="logo-exact.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<style>
:root{--ink:#201e20;--muted:#747079;--purple:#704487;--line:#e6e1e9;--wash:#f7f5f8;--surface:white;--red:#993e3e}
*{box-sizing:border-box}body{margin:0;background:#f8f7f6;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
main{max-width:860px;margin:auto;padding:14px 14px 45px}
header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
.brand{font-size:11px;color:var(--purple);letter-spacing:.14em;font-weight:800}h1{font-size:25px;margin:2px 0}h2{font-size:17px;margin:0 0 12px}
.card{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12px}.hstack{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}
button{cursor:pointer;font:inherit;font-weight:700;border:0;border-radius:9px;padding:11px 13px}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--purple);color:white}.secondary{background:#eee5f2;color:#57316b}.light{background:#f6f4f6;color:#39313c}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.mini{font-size:12px;padding:6px 9px}
input,select{font:inherit;width:100%;border:1px solid #d4cfd8;border-radius:9px;padding:10px;background:white;color:var(--ink);min-width:0}
label{display:block;margin:0 0 6px;font-size:12px;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span{grid-column:1/-1}.hidden{display:none!important}.vstack{display:flex;flex-direction:column;gap:10px}
.value{font-size:31px;font-weight:760;letter-spacing:-.025em;margin:3px 0}.value-card{background:var(--wash);border-radius:13px;padding:16px}
.notice{font-size:12px;color:var(--muted);margin:7px 0 0}.message{font-size:13px;font-weight:650;min-height:17px;margin-top:9px}.message.error{color:var(--red)}.message.success{color:#2d7752}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.rowname{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.number{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{font-weight:750}.sub{font-size:12px;color:var(--muted)}
details{margin-top:13px}summary{cursor:pointer;color:var(--purple);font-size:13px;font-weight:750}.warn{background:#fff6e9;border:1px solid #ecdabb;padding:12px;border-radius:10px}
#gate{padding:24px}#active .card:last-child{margin-bottom:0}
@media(max-width:550px){main{padding:10px 10px 30px}.card{padding:14px}.grid{gap:10px}.value{font-size:29px}.hstack button{flex-shrink:0}}
</style>
</head><body><main>
<header><div><div class="brand">KNIGHTS MOBILE BARS</div><h1>Stock Control</h1></div></header>
<div id="gate" class="card muted">Checking your Hub login…</div>
<div id="app" class="hidden">
<section class="card">
 <div class="hstack between" style="margin-bottom:10px"><h2 style="margin:0">Stocktakes</h2><button class="secondary" id="newBtn" type="button">+ New stocktake</button></div>
 <label for="sessionSelect">Choose a saved date</label>
 <select id="sessionSelect"><option value="">No stocktakes yet</option></select>
 <div id="sessionMsg" class="message" role="status"></div>
</section>
<div id="active" class="hidden">
<section class="card">
 <div class="hstack between">
   <div><div class="small muted">Stocktake dated <span id="dated"></span></div><div id="value" class="value">£0.00</div><div id="stats" class="small muted"></div></div>
   <div class="hstack"><button id="downloadBtn" type="button" class="outline mini">CSV</button><button id="saveBtn" type="button" class="primary">Save stocktake</button></div>
 </div>
 <div id="savedNote" class="message" role="status"></div>
 <p id="valueNote" class="notice"></p>
</section>
<section id="entryPanel" class="card">
 <h2>Add stock</h2>
 <form id="addForm">
  <div class="vstack">
   <div><label for="productSelect">Drink</label><select id="productSelect"><option value="">Select a drink</option></select></div>
   <div id="newProduct" class="grid hidden">
    <div class="span"><label for="name">Drink name</label><input id="name" maxlength="140" placeholder="e.g. Birra Moretti"></div>
    <div><label for="size">Bottle / can size</label><input id="size" maxlength="30" placeholder="330ml"></div>
    <div><label for="category">Category</label><select id="category"><option>Beer &amp; ale</option><option>Cider</option><option>Spirits</option><option>Wine &amp; prosecco</option><option>Soft drinks</option><option>Mixers</option><option>Other</option></select></div>
   </div>
   <div class="grid">
    <div><label for="count">Quantity</label><input id="count" type="number" min="1" step="1" inputmode="numeric" value="1" required></div>
    <div><label for="countKind">Counting</label><select id="countKind"><option value="loose">Loose bottles / cans</option><option value="case">Sealed cases</option><option value="half">Half bottles</option><option value="quarter">Quarter bottles</option><option value="threequarter">¾ bottles</option></select></div>
    <div id="caseField" class="span hidden"><label for="perCase">Bottles / cans per case</label><input id="perCase" type="number" step="1" min="1" value="24" inputmode="numeric"></div>
    <div class="span"><label for="cost">Purchase cost per full bottle / can (£)</label><input id="cost" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Optional"><p id="costHint" class="notice">Choose an existing item to reuse its last recorded purchase cost.</p></div>
   </div>
   <div class="hstack between"><button id="addBtn" type="submit" class="primary">+ Add to stock</button><span id="addPreview" class="small muted"></span></div>
  </div>
  <div id="addMsg" class="message" role="status"></div>
 </form>
</section>
<section class="card">
 <div class="hstack between"><h2 style="margin:0">Your stock</h2><span class="small muted" id="productCount"></span></div>
 <input id="search" type="search" placeholder="Search stock…" aria-label="Search stock" style="margin:12px 0 3px">
 <div id="stockList"></div>
 <div class="hstack between" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><strong>Total stock value</strong><strong id="bottomValue"></strong></div>
 <details id="corrections"><summary>Recent additions / correct a count</summary><div id="recentEntries"></div></details>
</section>
</div></div>
</main>
<script>
(()=>{
'use strict';
const BASE='https://jpjrsndbjklecvwiuvbf.supabase.co';
const KEY='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7';
const db=window.supabase.createClient(BASE,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=x=>'£'+Number(x||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=x=>Number(x||0).toLocaleString('en-GB',{maximumFractionDigits:3});
const norm=x=>String(x||'').trim().replace(/\s+/g,' ').toLowerCase();
const keyFor=x=>[norm(x.category),norm(x.product_name),norm(x.size_label)].join('|');
const isoToday=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());const get=x=>p.find(y=>y.type===x)?.value;return get('year')+'-'+get('month')+'-'+get('day')};
const dateNice=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
let sessions=[],entries=[],catalog=[],selected=null,busy=false,chosen='';
function notice(id,msg,err=false){const el=$(id);el.textContent=msg;el.className='message '+(err?'error':'success')}
function errorText(e){return e?.message||String(e)}
function session(){return sessions.find(x=>x.id===selected)}
function editable(){return session()?.status==='open'}
function mode(){return $('countKind').value}
function qtyAdd(){const n=Number($('count').value);if(mode()==='case')return n*Number($('perCase').value);if(mode()==='half')return n*.5;if(mode()==='quarter')return n*.25;if(mode()==='threequarter')return n*.75;return n}
function validCount(){const n=Number($('count').value),c=Number($('perCase').value);return Number.isSafeInteger(n)&&n>0&&n<100000&&(mode()!=='case'||(Number.isSafeInteger(c)&&c>0&&c<=1000&&n*c<100000))}
function updatePreview(){$('caseField').classList.toggle('hidden',mode()!=='case');$('addPreview').textContent=validCount()?fmt(qtyAdd())+' bottle equivalents':''}
function setDrink(){const value=$('productSelect').value;chosen=value;$('newProduct').classList.toggle('hidden',value!=='new');if(value==='new'){$('cost').value='';$('costHint').textContent='Enter the purchase cost if known. No live supplier prices are assumed.';return}if(value===''){$('cost').value='';$('costHint').textContent='Choose an existing item to reuse its last recorded purchase cost.';return}const p=catalog[Number(value)];if(!p)return;$('cost').value=p.unit_cost===null?'':Number(p.unit_cost).toFixed(2);$('costHint').textContent=p.unit_cost===null?'No saved cost for this drink yet. Enter when known.':'Last recorded cost: '+gbp(p.unit_cost)+' per full bottle/can. Change if it has changed.'}
function drawCatalog(){
 const previous=$('productSelect').value;
 $('productSelect').innerHTML='<option value="">Select a drink</option>'+catalog.map((p,i)=>'<option value="'+i+'">'+esc(p.product_name+' · '+(p.size_label||'size not recorded')+(p.unit_cost===null?'':' · '+gbp(p.unit_cost)))+'</option>').join('')+'<option value="new">+ New drink</option>';
 if(previous==='new'||(previous!==''&&catalog[Number(previous)]))$('productSelect').value=previous;
 if(!catalog.length)$('productSelect').value='new';
 setDrink();
}
async function loadCatalog(){
 let all=[],offset=0,part=[];
 do{
 const r=await db.from('kmb_stocktake_entries').select('id,category,product_name,size_label,unit_cost,created_at').order('created_at',{ascending:false}).order('id',{ascending:false}).range(offset,offset+499);
 if(r.error)throw r.error;part=r.data||[];all.push(...part);offset+=part.length;
 }while(part.length===500);
 const map=new Map();
 for(const row of all){const k=keyFor(row);if(!map.has(k))map.set(k,{...row});else if(map.get(k).unit_cost===null&&row.unit_cost!==null)map.get(k).unit_cost=row.unit_cost}
 catalog=[...map.values()].sort((a,b)=>a.product_name.localeCompare(b.product_name)||String(a.size_label).localeCompare(String(b.size_label)));
 drawCatalog();
}
async function loadSessions(preferred){
 const r=await db.from('kmb_stocktake_sessions').select('*').order('taken_on',{ascending:false}).order('created_at',{ascending:false});
 if(r.error)throw r.error;sessions=r.data||[];
 if(preferred&&sessions.some(x=>x.id===preferred))selected=preferred;
 else if(!sessions.some(x=>x.id===selected))selected=(sessions.find(x=>x.status==='open')||sessions[0])?.id||null;
 const counts={};for(const s of sessions)counts[s.taken_on]=(counts[s.taken_on]||0)+1;
 const seen={};
 $('sessionSelect').innerHTML=sessions.length?sessions.map(s=>{seen[s.taken_on]=(seen[s.taken_on]||0)+1;const dupe=counts[s.taken_on]>1?' · #'+seen[s.taken_on]:'';return '<option value="'+esc(s.id)+'">'+esc(dateNice(s.taken_on)+dupe+(s.status==='open'?' · In progress':' · Saved'))+'</option>'}).join(''):'<option value="">No stocktakes yet — select New stocktake</option>';
 $('sessionSelect').value=selected||'';
 await loadEntries();
}
async function loadEntries(){
 const s=session();$('active').classList.toggle('hidden',!s);
 if(!s){entries=[];return}
 let all=[],offset=0,part=[];
 do{const r=await db.from('kmb_stocktake_entries').select('*').eq('session_id',s.id).order('created_at',{ascending:false}).order('id',{ascending:false}).range(offset,offset+499);if(r.error)throw r.error;part=r.data||[];all.push(...part);offset+=part.length}while(part.length===500);
 entries=all;render();
}
function groups(){
 const map=new Map();
 for(const e of entries){const k=keyFor(e);if(!map.has(k))map.set(k,{category:e.category,name:e.product_name,size:e.size_label,quantity:0,value:0,unpriced:0});const g=map.get(k);g.quantity+=Number(e.quantity);if(e.unit_cost===null)g.unpriced+=Number(e.quantity);else g.value+=Number(e.quantity)*Number(e.unit_cost)}
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name)||String(a.size).localeCompare(String(b.size)));
}
function render(){
 const s=session();if(!s)return;
 const list=groups(),value=list.reduce((a,x)=>a+x.value,0),unpriced=list.reduce((a,x)=>a+x.unpriced,0),bottles=list.reduce((a,x)=>a+x.quantity,0);
 $('dated').textContent=dateNice(s.taken_on);
 $('value').textContent=gbp(value);$('bottomValue').textContent=gbp(value);
 $('stats').textContent=list.length+' products · '+fmt(bottles)+' bottle equivalents';
 $('productCount').textContent=list.length+' products';
 $('valueNote').textContent=unpriced?'Value is incomplete: '+fmt(unpriced)+' bottle equivalents have no recorded purchase cost.':'Value is based on recorded purchase costs, not retail selling prices.';
 $('entryPanel').classList.toggle('hidden',!editable());$('saveBtn').classList.toggle('hidden',!editable());
 $('savedNote').textContent=editable()?'Counts save as you add them. Press Save stocktake when finished.':'✓ Stocktake saved for '+dateNice(s.taken_on);
 $('savedNote').className='message '+(editable()?'':'success');
 const q=norm($('search').value),visible=list.filter(x=>norm(x.name+' '+x.size+' '+x.category).includes(q));
 $('stockList').innerHTML=visible.length?visible.map(x=>'<div class="row"><div><div class="rowname">'+esc(x.name)+'</div><div class="meta">'+esc(x.size||'Size unspecified')+' · '+esc(x.category)+'</div></div><div class="number"><div class="qty">'+fmt(x.quantity)+' bottles</div><div class="sub">'+(x.unpriced?'Incomplete cost':gbp(x.value))+'</div></div></div>').join(''):'<p class="muted small">No matching drinks found.</p>';
 $('recentEntries').innerHTML=entries.length?entries.map(x=>'<div class="row"><div><div class="rowname">'+esc(x.product_name)+'</div><div class="meta">'+fmt(x.quantity)+' equivalents'+(x.note?' · '+esc(x.note):'')+'</div></div>'+(editable()?'<button type="button" class="mini light" data-remove="'+esc(x.id)+'">Remove</button>':'')+'</div>').join(''):'<p class="muted small">No counts added yet.</p>';
}
async function createNew(){
 if(busy)return;
 try{
 busy=true;$('newBtn').disabled=true;
 const r=await db.from('kmb_stocktake_sessions').insert({taken_on:isoToday(),label:'Stocktake'}).select('id').single();if(r.error)throw r.error;
 selected=r.data.id;await loadSessions(selected);
 notice('sessionMsg','New stocktake created for '+dateNice(isoToday())+'.');
 $('productSelect').value=catalog.length?'':'new';setDrink();
 }catch(e){notice('sessionMsg',errorText(e),true)}finally{busy=false;$('newBtn').disabled=false}
}
async function add(event){
 event.preventDefault();if(busy||!editable())return;
 if(!validCount()){notice('addMsg','Enter a valid number of bottles or cases.',true);return}
 const p=$('productSelect').value;
 if(p===''){notice('addMsg','Choose a drink first.',true);return}
 const name=p==='new'?$('name').value.trim().replace(/\s+/g,' '):catalog[Number(p)]?.product_name;
 const size=p==='new'?$('size').value.trim():catalog[Number(p)]?.size_label;
 const category=p==='new'?$('category').value:catalog[Number(p)]?.category;
 const costText=$('cost').value.trim(),cost=costText===''?null:Number(costText);
 if(!name){notice('addMsg','Enter the drink name.',true);return}
 if(cost!==null&&(!Number.isFinite(cost)||cost<0||cost>100000)){notice('addMsg','Check the purchase cost.',true);return}
 const m=mode(),fraction={half:.5,quarter:.25,threequarter:.75}[m]||null;
 const row={session_id:selected,product_name:name,size_label:size||'',category,entry_type:m==='case'?'case':fraction?'partial':'loose',
 quantity:qtyAdd(),unit_cost:cost,note:'',cases_count:m==='case'?Number($('count').value):null,units_per_case:m==='case'?Number($('perCase').value):null,
 partial_bottles:fraction?Number($('count').value):null,partial_fraction:fraction};
 try{
 busy=true;$('addBtn').disabled=true;
 const r=await db.from('kmb_stocktake_entries').insert(row);if(r.error)throw r.error;
 await loadCatalog();await loadEntries();
 $('count').value='1';$('countKind').value='loose';updatePreview();
 const found=catalog.findIndex(x=>keyFor(x)===keyFor(row));
 $('productSelect').value=found>=0?String(found):'new';setDrink();
 $('name').value='';$('size').value='';notice('addMsg','✓ Added '+fmt(row.quantity)+' '+name+'. Totals updated.');
 }catch(e){notice('addMsg',errorText(e),true)}
 finally{busy=false;$('addBtn').disabled=false}
}
async function save(){
 if(!editable()||busy)return;
 if(!entries.length&&!confirm('Save this empty stocktake?'))return;
 try{
 busy=true;$('saveBtn').disabled=true;
 const r=await db.from('kmb_stocktake_sessions').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',selected);
 if(r.error)throw r.error;
 await loadSessions(selected);notice('sessionMsg','✓ Stocktake saved under '+dateNice(session().taken_on)+'.');
 }catch(e){notice('sessionMsg',errorText(e),true)}
 finally{busy=false;$('saveBtn').disabled=false}
}
async function remove(id){
 if(!editable()||busy)return;const e=entries.find(x=>x.id===id);if(!e)return;
 if(!confirm('Remove '+fmt(e.quantity)+' '+e.product_name+' from this count?'))return;
 try{busy=true;const r=await db.from('kmb_stocktake_entries').delete().eq('id',id).eq('session_id',selected);if(r.error)throw r.error;await loadCatalog();await loadEntries()}catch(e){alert(errorText(e))}finally{busy=false}
}
function csvDownload(rows,name){
 const content='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 saveBlob(new Blob([content],{type:'text/csv;charset=utf-8'}),name);
}
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function currentCSV(){
 const s=session();if(!s)return;
 const rows=[['Date','Drink','Size','Category','Bottle equivalents','Known purchase cost GBP','Unpriced equivalents']];
 groups().forEach(x=>rows.push([s.taken_on,x.name,x.size,x.category,Number(x.quantity.toFixed(3)),Number(x.value.toFixed(2)),Number(x.unpriced.toFixed(3))]));
 csvDownload(rows,'KMB-stocktake-'+s.taken_on+'.csv');
}
async function init(){
 try{
 if(!window.supabase)throw Error('Cannot load database connection. Check your internet.');
 const {data,error}=await db.auth.getUser();if(error||!data?.user)throw Error('Please sign in to KMB.Hub, then reopen the Stock tab.');
 const r=await db.from('staff_profiles').select('role').eq('id',data.user.id).maybeSingle();
 if(r.error)throw r.error;
 if(r.data?.role!=='admin')throw Error('Stocktakes are for Hub administrators only.');
 $('gate').classList.add('hidden');$('app').classList.remove('hidden');
 await loadCatalog();await loadSessions();updatePreview();
 }catch(e){$('gate').textContent=errorText(e)}
}
$('newBtn').onclick=createNew;
$('sessionSelect').onchange=async e=>{selected=e.target.value;try{await loadEntries()}catch(x){notice('sessionMsg',errorText(x),true)}};
$('productSelect').onchange=setDrink;
$('count').oninput=updatePreview;$('perCase').oninput=updatePreview;$('countKind').onchange=updatePreview;
$('addForm').onsubmit=add;$('saveBtn').onclick=save;$('search').oninput=render;
$('downloadBtn').onclick=currentCSV;
$('recentEntries').onclick=e=>{const b=e.target.closest('[data-remove]');if(b)remove(b.dataset.remove)};
$('cost').oninput=()=>{$('costHint').textContent='This purchase cost will be saved for this count and suggested next time.'};
if(window.parent!==window && typeof ResizeObserver==='function'){
 const sendHeight=()=>window.parent.postMessage({type:'kmb-stock-height',height:document.documentElement.scrollHeight},window.location.origin);
 new ResizeObserver(sendHeight).observe(document.body);
 window.addEventListener('load',sendHeight);
}
init();
})();
</script>
</body></html>
