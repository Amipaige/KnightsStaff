<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}</style></head><body><iframe id="app" src="staffing-v2.html"></iframe><script>(function(){const f=document.getElementById('app');const SUPA='https://jpjrsndbjklecvwiuvbf.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2...';function db(d){return d.defaultView.supabase?.createClient?.(SUPA,KEY)}function run(){const d=f.contentDocument;if(!d)return;const obs=new MutationObserver(()=>setup(d));obs.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setup(d)}async function setup(d){const app=d.getElementById('app'),auth=d.getElementById('auth');if(!app)return;const sb=db(d);if(!sb)return;const sess=(await sb.auth.getSession()).data.session;if(!sess)return;const p=(await sb.from('staff_profiles').select('*').eq('id',sess.user.id).maybeSingle()).data;if(!p)return;if(p.role==='admin')return;const gate=d.getElementById('staffGate');if(!gate||gate.classList.contains('hidden'))return;if(d.getElementById('formDoneBtn'))return;const box=d.createElement('div');box.id='formDoneBox';box.style.cssText='margin-top:14px;padding:14px;border:1px solid #e5ddd0;border-radius:12px;background:#fffdf9';box.innerHTML='<b>Already completed the form?</b><p style="font-size:12px;color:#777166;line-height:1.5;margin:6px 0 10px">If you have already submitted the Knights New Starter Form, tell the admin so they can check your response and approve your account.</p><button id="formDoneBtn" type="button" style="width:100%;padding:12px;border:0;border-radius:9px;background:#b59a63;color:#171716;font-weight:700">✓ I have completed the form</button><p id="formDoneMsg" style="font-size:12px;color:#777166;margin:8px 0 0"></p>';gate.appendChild(box);d.getElementById('formDoneBtn').onclick=async()=>{const b=d.getElementById('formDoneBtn'),m=d.getElementById('formDoneMsg');b.disabled=true;m.textContent='Updating…';const r=await sb.from('staff_profiles').update({registration_status:'awaiting_approval'}).eq('id',sess.user.id);if(r.error){m.textContent='Could not update: '+r.error.message;b.disabled=false;return}m.textContent='✓ Form marked as completed. Knights will check it and approve your account.';b.textContent='✓ Form submitted for approval';};}f.addEventListener('load',run)})();</script></body></html>
