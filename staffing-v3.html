<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}</style></head><body><iframe id="staffFrame" src="staffing.html" title="Knights Staff"></iframe><script>(function(){const f=document.getElementById('staffFrame');function apply(){try{const d=f.contentDocument;if(!d)return;const status=d.getElementById('status');const adminTab=d.getElementById('adminTab');const staffTab=d.getElementById('staffTab');if(adminTab&&!adminTab.classList.contains('hidden')&&status&&/Administrator/i.test(status.textContent||'')){if(staffTab)staffTab.style.display='none';const style=d.createElement('style');style.id='admin-no-shifts-style';style.textContent='#staffView{display:none!important}.tabs{display:block!important}.tabs #adminTab{display:block!important;width:100%}';if(!d.getElementById('admin-no-shifts-style'))d.head.appendChild(style)}}catch(e){}}f.addEventListener('load',function(){apply();setInterval(apply,500)});})();</script></body></html>
