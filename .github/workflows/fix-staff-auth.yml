name: Fix staff email verification
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-staff-auth.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff auth flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('staffing.html')
          s = p.read_text()
          old = "options:{data:{full_name:name}}"
          new = "options:{data:{full_name:name},emailRedirectTo:window.location.origin+window.location.pathname}"
          if old not in s:
              raise SystemExit('signup options pattern not found')
          s = s.replace(old, new, 1)
          old_block = "if(r.data.user){const admin=email===ADMIN_EMAIL;const p=await db.from('staff_profiles').upsert({id:r.data.user.id,email,full_name:name,registration_status:admin?'approved':'not_completed',role:admin?'admin':'staff'},{onConflict:'id'});if(p.error)throw p.error}"
          if old_block not in s:
              raise SystemExit('unauthenticated profile upsert block not found')
          s = s.replace(old_block, '', 1)
          old_msg = "else msg('Account created. Check your email to confirm it, then sign in.')"
          new_msg = "else msg(\"Account created. We’ve sent you an email to verify your email address. Please check your inbox (and spam/junk). Once you click the verification link, you can log in with your new account details.\")"
          if old_msg not in s:
              raise SystemExit('signup success message not found')
          s = s.replace(old_msg, new_msg, 1)
          marker = "db.auth.getSession().then(({data})=>data.session&&loadApp(data.session.user));"
          if marker not in s:
              raise SystemExit('session bootstrap marker not found')
          handler = "const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));const verified=hashParams.get('type')==='signup'&&hashParams.get('access_token');if(verified){window.history.replaceState({},document.title,window.location.pathname);setAuthMode(false);msg('Email verified successfully. You can now log in with your new account details.');}"
          s = s.replace(marker, handler + marker, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing.html
          git diff --cached --quiet || git commit -m 'Fix staff email verification flow'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-staff-auth.yml
          git add .github/workflows/fix-staff-auth.yml
          git commit -m 'Remove temporary auth fix workflow'
          git push
