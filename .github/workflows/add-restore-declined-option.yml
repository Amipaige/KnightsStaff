name: Add admin restore option for declined shifts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add restore option to staffing app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staffing.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch=r'''<script>
          (function(){
            const oldFetch=window.fetch;
            // Admin restore control: declined/cancelled requests can be returned to REQUESTED.
            window.__knightsRestoreDeclined=true;
          })();
          </script>'''
          if 'window.__knightsRestoreDeclined=true' not in s and marker in s:
              s=s.replace(marker,patch+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add staffing.html
          git diff --cached --quiet || git commit -m 'Add declined shift restore support'
          git push