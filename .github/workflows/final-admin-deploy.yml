name: Final Admin Shifts Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: final-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for admin enhancement if needed
        run: |
          for i in $(seq 1 30); do
            if grep -q 'KNIGHTS_ADMIN_ENHANCEMENTS' staffing.html; then break; fi
            git fetch origin main
            git reset --hard origin/main
            sleep 2
          done
          grep -q 'KNIGHTS_ADMIN_ENHANCEMENTS' staffing.html || { echo 'Admin enhancement was not applied'; exit 1; }
      - name: Correct staffing schema and show all events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staffing.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".gte('event_date',new Date().toISOString().slice(0,10))","")
          s=s.replace('staff_id','user_id')
          s=s.replace("e.manager_id","e.manager_id")
          s=s.replace("e.bar_package", "e.bar_package || e.bar_type")
          s=s.replace("e.start_time", "e.start_time || e.shift_start")
          s=s.replace("e.finish_time", "e.finish_time || e.shift_end")
          s=s.replace("e.dress_code", "e.dress_code")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing.html
          git diff --cached --quiet || git commit -m 'Correct admin shift staff schema and event list'
          git push || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
