name: Add staff removal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[remove-staff]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add remove staff control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('staffing.html')
          s = p.read_text(encoding='utf-8')

          old = r"function renderStaffList\(\)\{.*?\}window\.approveStaff="
          new = '''function renderStaffList(){const approved=people.filter(p=>p.role==='staff'&&p.registration_status==='approved');$('staffList').innerHTML=approved.length?approved.map(p=>`<div class="staff-person"><div class="row"><div><b>${esc(p.full_name)}</b><br><span class="small">${esc(p.email)}</span></div><button class="btn mini red" type="button" onclick="removeStaff('${p.id}')">Remove staff</button></div></div>`).join(''):'<p class="small">No staff yet.</p>'}window.removeStaff=async id=>{const p=people.find(x=>x.id===id);if(!p)return;if(!confirm('Remove '+p.full_name+' from the Knights staff list? They will need to sign up again before they can access shifts.'))return;const r=await db.rpc('remove_staff_member',{target_id:id});if(r.error)return alert(r.error.message);await loadAdmin()};window.approveStaff='''
          s2, n = re.subn(old, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find the staff list block to patch')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit staff removal feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staffing.html
          git diff --cached --quiet && exit 0
          git commit -m "Add staff removal control [remove-staff]"
          git push
