name: Fix event display
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[event-display-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good event renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path('staffing.html')
          current=p.read_text(encoding='utf-8')
          old=subprocess.check_output(['git','show','024e6c6e294d3f1f4599eaa4eeece2603c70a52c:staffing.html'],text=True)
          m=re.search(r'function renderEvents\(byId\)\{.*?\}(?=function loadManagerLists\(\))',old,re.S)
          if not m:
              raise SystemExit('Known-good event renderer not found')
          renderer=m.group(0)
          if 'function renderEvents(byId)' in current:
              current=re.sub(r'function renderEvents\(byId\)\{.*?\}(?=function loadManagerLists\(\))',renderer,current,count=1,flags=re.S)
          else:
              marker='function loadManagerLists()'
              if marker not in current:
                  raise SystemExit('Current loadManagerLists marker not found')
              current=current.replace(marker,renderer+marker,1)
          p.write_text(current,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staffing.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin event display [event-display-fix]"
          git push
