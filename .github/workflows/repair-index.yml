name: Repair Knights app script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped newlines and logo path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\\n', '\\\\n')
          s = s.replace('src="/KnightsStock/logo.svg"', 'src="logo.svg"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Fix email confirmation redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('staffing.html')
          s = p.read_text(encoding='utf-8')
          old = "db.auth.signUp({email,password,options:{data:{full_name:name}}})"
          new = "db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.origin+window.location.pathname}})"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html staffing.html
          git diff --cached --quiet || git commit -m 'Fix email confirmation redirect'
          git push
