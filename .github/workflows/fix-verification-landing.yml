name: Fix verification landing
on:
  push:
    paths:
      - .github/workflows/fix-verification-landing.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verification landing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('staffing.html')
          s=p.read_text()
          old="const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));const verified=hashParams.get('type')==='signup'&&hashParams.get('access_token');if(verified){window.history.replaceState({},document.title,window.location.pathname);setAuthMode(false);msg('Email verified successfully. You can now log in with your new account details.');}db.auth.getSession().then(({data})=>data.session&&loadApp(data.session.user));"
          new="const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,''));const verified=hashParams.get('type')==='signup'&&hashParams.get('access_token');if(verified){window.history.replaceState({},document.title,window.location.pathname);db.auth.signOut().then(()=>{setAuthMode(false);msg('Email verified successfully. You can now log in with your new account details.');});}else db.auth.getSession().then(({data})=>data.session&&loadApp(data.session.user));"
          if old not in s: raise SystemExit('verification handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing.html
          git commit -m 'Show login prompt after email verification'
          rm .github/workflows/fix-verification-landing.yml
          git add .github/workflows/fix-verification-landing.yml
          git commit -m 'Remove temporary verification workflow'
          git push
