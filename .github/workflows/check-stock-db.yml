name: Check shared stock database
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-stock-db.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query stock_products
        env:
          SUPABASE_URL: https://jpjrsndbjklecvwiuvbf.supabase.co
          SUPABASE_KEY: sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7
        run: |
          set -e
          code=$(curl -sS -o /tmp/body -w '%{http_code}' "$SUPABASE_URL/rest/v1/stock_products?select=id,name,received,sold&order=name&limit=5" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          python3 - <<'PY'
          import json
          body=open('/tmp/body').read()
          try:
            data=json.loads(body)
            if isinstance(data,list):
              print('Rows returned:', len(data))
              for r in data: print(r.get('name'), r.get('received'), r.get('sold'))
            else:
              print('API error:', data.get('message') or data.get('hint') or data)
          except Exception:
            print(body[:1000])
          PY
          test "$code" = "200"