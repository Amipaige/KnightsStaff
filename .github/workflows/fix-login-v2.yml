name: Fix Knights login v2
on:
  push:
    paths:
      - '.github/workflows/fix-login-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix login startup and logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const db=supabase.createClient('https://jpjrsndbjklecvwiuvbf.supabase.co','sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7'),HASH='59ee58a08f15abe3c316177cf952fa86ad7ad3d4512cd89eddbb2d013fd4e8b6',MEASURE=25;"
          new="let db=null;const SUPABASE_URL='https://jpjrsndbjklecvwiuvbf.supabase.co',SUPABASE_KEY='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7',HASH='59ee58a08f15abe3c316177cf952fa86ad7ad3d4512cd89eddbb2d013fd4e8b6',MEASURE=25;"
          if old not in s: raise SystemExit('Supabase declaration not found')
          s=s.replace(old,new,1)
          s=s.replace('src="logo.png" alt="Knights Mobile Bars logo"','src="/KnightsStock/logo.svg" alt="Knights Mobile Bars logo"',1)
          oldload="async function load(){const r=await db.from('stock_products').select('*').order('name');"
          newload="async function load(){if(!db){if(!window.supabase){$('connection').textContent='Database service could not load. Please refresh and try again.';return}db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}const r=await db.from('stock_products').select('*').order('name');"
          if oldload not in s: raise SystemExit('Load function not found')
          s=s.replace(oldload,newload,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix login startup and logo loading'
          git push
