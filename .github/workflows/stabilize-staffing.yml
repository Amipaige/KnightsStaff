name: Stabilize staffing app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[staffing-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix declined staff rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('staffing.html')
          s=p.read_text(encoding='utf-8')

          # Only confirmed signups count as assigned staff in admin/event totals.
          m=re.search(r'function activeSignups\(eventId\)\{.*?\}',s,re.S)
          if not m:
              raise SystemExit('activeSignups function not found')
          s=s[:m.start()] + "function activeSignups(eventId){return signups.filter(s=>s.event_id===eventId&&s.status==='confirmed')}" + s[m.end():]

          old="${map[e.id]?(map[e.id]==='confirmed'?'CONFIRMED':'REQUESTED'):'I\\'M AVAILABLE'}"
          new="${map[e.id]?(map[e.id]==='confirmed'?'CONFIRMED':(['declined','rejected','cancelled'].includes(map[e.id])?'Not required for this shift, thank you.':'REQUESTED')):'I\\'M AVAILABLE'}"
          if old not in s:
              raise SystemExit('Staff status button pattern not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix declined staff status display [staffing-final]'
          git push
