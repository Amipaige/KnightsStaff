name: Fix guest count display

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix event displays
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('staffing.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("${e.dress_code?`<div class=\"small\">Dress: ${esc(e.dress_code)}</div>`:''}", "${e.guest_count!=null&&e.guest_count!==''?`<div class=\"small\">👥 Guest count: ${esc(e.guest_count)}</div>`:''}")
          s=s.replace("${e.dress_code?`<div class=\"small\">Dress: ${esc(e.dress_code)}</div>`:''}", "${e.guest_count!=null&&e.guest_count!==''?`<div class=\"small\">👥 Guest count: ${esc(e.guest_count)}</div>`:''}")
          s=s.replace("<label>Dress Code</label>", "<label>Guest count</label>")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-guest-count-display-2.yml
          git add staffing.html .github/workflows/fix-guest-count-display-2.yml
          git commit -m "Show guest count on event cards"
          git push
