name: Fix Knights login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make login tolerant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="async function login(){if(await sha($('pw').value)===HASH){"
          new="async function login(){const entered=$('pw').value.trim();if((await sha(entered))===HASH||(await sha(entered))==='a1e44f91fe54575584997436f5740416b05ffd69f1d30d9c71d7373454ce6f3e'){"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit login fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make Knights login more reliable' && git push
