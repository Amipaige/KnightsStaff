name: Fix KnightsStock parser
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<nav class="nav"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="stock">Stock</button><button data-tab="add">Add Stock</button></nav>', '<nav class="nav"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="stock">Stock</button><button data-tab="add">Add Stock</button><button data-tab="take">Stock Take</button><button data-tab="events">Events</button></nav>')
          s=s.replace('</section>\n</div>\n<div id="modal"', '</section>\n<section id="take" class="hidden"><h2>Stock Take</h2><div class="panel"><p class="muted">Physical stock counting will be added here next.</p></div></section>\n<section id="events" class="hidden"><h2>Events</h2><div class="panel"><p class="muted">Event-by-event stock tracking will be added here next.</p></div></section>\n</div>\n<div id="modal"',1)
          s=re.sub(r'async function pdfText\(file\)\{.*?\n\}', '''async function pdfText(file){const data=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data,disableWorker:true}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();const items=c.items.filter(x=>x.str&&x.str.trim()).map(x=>({t:x.str.trim(),x:x.transform[4],y:Math.round(x.transform[5])}));const groups=[];for(const it of items){let g=groups.find(z=>Math.abs(z.y-it.y)<=2);if(!g){g={y:it.y,a:[]};groups.push(g)}g.a.push(it)}groups.sort((a,b)=>b.y-a.y);out+=groups.map(g=>g.a.sort((a,b)=>a.x-b.x).map(x=>x.t).join(' ')).join('\\n')+'\\n'}return out}''',s,flags=re.S)
          s=re.sub(r'function bottleMl\(s\)\{.*?\n\}', '''function bottleMl(s){let m=s.match(/(\\d+(?:\\.\\d+)?)\\s*(ml|cl)\\b/i);if(m)return Math.round(Number(m[1])*(m[2].toLowerCase()==='cl'?10:1));m=s.match(/(\\d+(?:\\.\\d+)?)\\s*(litre|liter|l)\\b/i);if(m)return Math.round(Number(m[1])*1000);return null}''',s,flags=re.S)
          start=s.index('function parse(text){'); end=s.index("$('file').onchange",start)
          newparse='''function parseBooker(text){const items=[];for(const line of text.split(/\\r?\\n/).map(x=>x.replace(/\\s+/g,' ').trim())){const m=line.match(/^\\d{5,}\\s+(.+?)\\s+(\\d+)\\s+((?:\\d+(?:\\.\\d+)?\\s*(?:ml|cl|l|ltr|litre|liter))(?:\\s+\\d+x\\d+(?:ml|cl|l))?)\\s+(\\d+)\\s+/i);if(!m)continue;const name=m[1].trim(),pack=Number(m[2]),qty=Number(m[4]);const ix=m[3].match(/(\\d+)x/i);const inner=ix?Number(ix[1]):1;items.push({name,type:'unit',qty,pack:pack*inner,units:qty*pack*inner})}return{supplier:'Booker',items}}\nfunction parse(text){if(/booker/i.test(text))return parseBooker(text);const supplier=/lwc/i.test(text)?'LWC':/tesco/i.test(text)?'Tesco':'Receipt / invoice';const raw=text.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean),items=[];for(let i=0;i<raw.length;i++){const line=raw[i].replace(/\\s+/g,' '),m=line.match(/^(\\d{1,3})\\s+(.+?)\\s+£\\s*\\d+(?:\\.\\d{1,2})?/);if(!m)continue;const qty=Number(m[1]),name=cleanName(m[2]);let extra='';for(let j=i+1;j<Math.min(i+4,raw.length);j++){const n=raw[j].replace(/\\s+/g,' ');if(/^\\d{1,3}\\s+.+?\\s+£\\s*\\d/i.test(n)||/^(subtotal|total|saving|promotion|clubcard|card|mastercard|visa|amex|points|authorisation|merchant)/i.test(n))break;if(/^cc\\b/i.test(n)||/£/.test(n))continue;extra+=' '+n}const full=(name+' '+extra).trim();if(/subtotal|total|saving|promotion|vat|card|points/i.test(full))continue;const spirit=isSpirit(full),size=bottleMl(full);if(spirit){const ml=size||0;items.push({name:cleanSpiritName(name),type:'spirit',qty,bottleMl:ml,units:ml?Math.round(ml/MEASURE_ML*qty):0})}else{const px=full.match(/(\\d+)\\s*(?:x|×)\\s*(?:\\d+(?:\\.\\d+)?\\s*)?(?:ml|cl|l|litre|liter)?/i),pack=px?Number(px[1]):1;items.push({name:cleanName(name),type:'unit',qty,pack,units:qty*pack})}}return{supplier,items}}\n'''
          s=s[:start]+newparse+s[end:]
          s=s.replace("${x.type==='spirit'?esc(x.bottleMl+'ml bottle'):'pack '+x.pack}","${x.type==='spirit'?(x.bottleMl?esc(x.bottleMl+'ml bottle'):'SIZE REQUIRED'):'pack '+x.pack}")
          s=s.replace("${x.units} ${x.type==='spirit'?'shots':'units'}","${x.type==='spirit'?(x.units?x.units+' shots':'SIZE REQUIRED'):(x.units+' units')}")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Booker PDF parsing [skip ci]"
          git push