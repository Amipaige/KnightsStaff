name: Deploy Knights Stock Control

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare admin shifts script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin-shifts.js'); j=p.read_text(encoding='utf-8')
          h=Path('staffing.html'); s=h.read_text(encoding='utf-8')
          m=re.search(r"const URL='([^']+)',KEY='([^']+)'",s)
          if not m: raise SystemExit('Supabase configuration not found')
          j=j.replace('__SUPA_URL__',m.group(1)).replace('__SUPA_KEY__',m.group(2))
          p.write_text(j,encoding='utf-8')
          if 'admin-shifts.js?v=1' not in s:
            s=s.replace('</body>','<script src="admin-shifts.js?v=1"></script></body>')
            h.write_text(s,encoding='utf-8')
          PY
      - name: Inject live fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="fix-live.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'<script src="cleanup-ui.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'<script src="shift-status-fix.js\?v=[^"]+"></script>','',s)
          s=s.replace('</body>','<script src="fix-live.js?v=16"></script><script src="cleanup-ui.js?v=1"></script><script src="shift-status-fix.js?v=1"></script></body>')
          p.write_text(s,encoding='utf-8')

          h=Path('staffing.html'); s=h.read_text(encoding='utf-8')
          s=re.sub(r'<script src="staff-event-notes.js\?v=[^"]+"></script>','',s)
          s=s.replace('</body>','<script src="staff-event-notes.js?v=1"></script></body>')
          h.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
