name: Add shift request controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pending-controls-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add approve and decline controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('staffing.html')
          current=p.read_text(encoding='utf-8')
          start=current.find('function renderEvents(byId){')
          end=current.find('window.removeStaff=async id=>', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not find renderEvents function')
          renderer=r'''function renderEvents(byId){if(!events.length){$('adminEvents').innerHTML='<div class="card"><h2>Events</h2><p class="small">No upcoming events.</p></div>';return}$('adminEvents').innerHTML='<div class="card"><h2>Events</h2>'+events.map(e=>{const assigned=activeSignups(e.id);const assignedCount=assigned.length;const needed=Math.max(0,e.staff_required-assignedCount);const manager=byId[e.manager_id];const available=people.filter(p=>p.role==='staff'&&p.registration_status==='approved'&&!assigned.some(s=>s.staff_id===p.id));return `<div class="card"><div class="row"><div><div class="date">${dateFmt(e.event_date)}</div><div class="event">${esc(e.event_name)}</div></div><span class="badge ${needed?'need':'approved'}">${needed?needed+' staff needed':'Fully staffed'}</span></div><div class="meta">📍 ${esc(e.venue)}<br>🕐 Arrival ${timeFmt(e.arrival_time)} · ${timeFmt(e.start_time)}–${timeFmt(e.finish_time)}<br>👥 ${assignedCount} / ${e.staff_required} staff</div><div class="manager">👑 Bar Manager: <b>${esc(manager?.full_name||e.manager_name||'Not assigned')}</b></div>${e.bar_package?`<div class="small">Package: ${esc(e.bar_package)}</div>`:''}${e.dress_code?`<div class="small">Dress: ${esc(e.dress_code)}</div>`:''}${e.notes?`<div class="small">${esc(e.notes)}</div>`:''}<div class="event-actions"><button class="btn gold" type="button" onclick="openEdit('${e.id}')">Amend event</button><button class="btn red" type="button" onclick="deleteEvent('${e.id}')">Delete event</button></div>${assigned.length?'<div class="small"><b>Assigned staff</b></div>'+assigned.map(s=>{const p=byId[s.staff_id];const pendingActions=s.status==='pending'?`<div class="actions"><button class="btn mini green" type="button" onclick="setSignup('${s.id}','confirmed')">Approve request</button><button class="btn mini red" type="button" onclick="setSignup('${s.id}','declined')">Decline request</button></div>`:'';return `<div class="signup-line"><div class="row"><span>${esc(p?.full_name||'Unknown staff')}</span><span class="badge ${s.status==='confirmed'?'approved':'pending'}">${esc(statusLabel(s.status))}</span></div>${pendingActions}<button class="btn mini red" type="button" onclick="removeSignup('${s.id}')">Remove from shift</button></div>`}).join(''): '<p class="small">No staff assigned yet.</p>'}<div class="grid"><div><select id="addStaff_${e.id}"><option value="">Add approved staff…</option>${available.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select></div><div><button class="btn green" type="button" onclick="addStaffToShift('${e.id}')">Add to shift</button></div></div></div>`}).join('')+'</div>'}
          '''
          current=current[:start]+renderer+current[end:]
          p.write_text(current,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staffing.html
          git diff --cached --quiet && exit 0
          git commit -m "Add shift request approval controls [pending-controls-fix]"
          git push
