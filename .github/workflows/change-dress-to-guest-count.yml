name: Change dress code to guest count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace dress code with guest count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('staffing.html')
          s = p.read_text()
          replacements = {
              '<label>Dress code</label><input id="dressCode" placeholder="Black trousers & white shirt">': '<label>Guest count</label><input id="guestCount" type="number" min="1" placeholder="120">',
              '<label>Dress code</label><input id="modalDress">': '<label>Guest count</label><input id="modalGuestCount" type="number" min="1" placeholder="120">',
              "${e.dress_code?`<div class=\\\"small\\\">Dress: ${esc(e.dress_code)}</div>`:''}": "${e.guest_count?`<div class=\\\"small\\\">👥 Guest count: ${esc(e.guest_count)}</div>`:''}",
              "${e.dress_code?`<div class=\\\"small\\\">${esc(e.dress_code)}</div>`:''}": "${e.guest_count?`<div class=\\\"small\\\">👥 Guest count: ${esc(e.guest_count)}</div>`:''}",
              "$('modalDress').value=e.dress_code||'';": "$('modalGuestCount').value=e.guest_count||'';",
              "dress_code:$('modalDress').value.trim(),": "guest_count:$('modalGuestCount').value?Math.max(1,Number($('modalGuestCount').value)):null,",
              "dress_code:$('dressCode').value.trim(),": "guest_count:$('guestCount').value?Math.max(1,Number($('guestCount').value)):null,",
              "['eventName','eventDate','venue','arrival','start','finish','manager','barPackage','dressCode','notes']": "['eventName','eventDate','venue','arrival','start','finish','manager','barPackage','guestCount','notes']",
              "$('dressCode').value=e.dress_code||'';": "$('guestCount').value=e.guest_count||'';",
          }
          for old, new in replacements.items():
              if old not in s:
                  print('Not found:', old[:100])
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staffing.html
          git diff --cached --quiet || git commit -m "Replace dress code with guest count"
          git push