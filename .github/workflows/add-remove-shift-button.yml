name: Add admin shift removal button

on:
  push:
    paths:
      - '.github/workflows/add-remove-shift-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add remove-staff control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('staffing-v2.html')
          s = p.read_text()

          old = "${s.status==='pending'?` Confirm <button onclick=\\\"setSignup('${s.id}','confirmed')\\\">Confirm</button> <button onclick=\\\"setSignup('${s.id}','declined')\\\">Decline</button>`:''}"
          # The minified page uses a simpler literal fragment; replace that exact fragment.
          old = "${s.status==='pending'?` <button onclick=\"setSignup('${s.id}','confirmed')\">Confirm</button> <button onclick=\"setSignup('${s.id}','declined')\">Decline</button>`:''}"
          new = "${s.status==='pending'?` <button onclick=\"setSignup('${s.id}','confirmed')\">Confirm</button> <button onclick=\"setSignup('${s.id}','declined')\">Decline</button>`:''} <button class=\"red mini\" onclick=\"removeSignup('${s.id}')\">Remove</button>"

          if old not in s:
              raise SystemExit('Could not find staff request controls')
          s = s.replace(old, new, 1)

          old_fn = "window.setSignup=async(id,status)=>{const r=await db.from('shift_signups').update({status}).eq('id',id);if(r.error)return alert(r.error.message);await loadAdmin()}"
          new_fn = old_fn + ";window.removeSignup=async id=>{if(!confirm('Remove this staff member from the shift?'))return;const r=await db.from('shift_signups').update({status:'cancelled'}).eq('id',id);if(r.error)return alert(r.error.message);await loadAdmin()}"
          if old_fn not in s:
              raise SystemExit('Could not find setSignup function')
          s = s.replace(old_fn, new_fn, 1)

          p.write_text(s)
          PY

      - name: Commit updated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing-v2.html
          git diff --cached --quiet || git commit -m 'Add admin remove staff from shift button'
          git push
