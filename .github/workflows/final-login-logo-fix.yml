name: Final login and logo fix
on:
  push:
    paths:
      - '.github/workflows/final-login-logo-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login and logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('src="logo.svg" alt="Knights Mobile Bars logo"','src="logo.svg?v=4" alt="Knights Mobile Bars logo"',1)
          fallback='''<script>\n(function(){\n  const expected='59ee58a08f15abe3c316177cf952fa86ad7ad3d4512cd89eddbb2d013fd4e8b6';\n  async function digest(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v.trim()));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}\n  window.loginFallback=async function(){\n    const input=document.getElementById('pw'), err=document.getElementById('loginErr');\n    err.textContent='';\n    try{\n      if(!input.value){err.textContent='Please enter the password.';return;}\n      if(await digest(input.value)===expected){sessionStorage.k='1';document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';if(typeof window.load==='function')window.load();}\n      else err.textContent='Incorrect password.';\n    }catch(e){err.textContent='Login could not run. Please refresh the page.';}\n  };\n})();\n</script>\n'''
          if 'window.loginFallback' not in s:
              s=s.replace('</head>',fallback+'</head>',1)
          s=s.replace('<button class="primary" style="width:100%;margin-top:10px" id="loginBtn">Log in</button>','<button class="primary" style="width:100%;margin-top:10px" id="loginBtn" onclick="loginFallback()">Log in</button>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make login independent and refresh logo cache'
          git push
