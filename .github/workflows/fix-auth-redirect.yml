name: Fix auth confirmation redirect

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-auth-redirect.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix signup confirmation redirect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('staffing.html')
          s = p.read_text()
          old = "db.auth.signUp({email,password,options:{data:{full_name:name}}})"
          new = "db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.origin+window.location.pathname}})"
          if old not in s:
              raise SystemExit('Expected signup code was not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staffing.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix email confirmation redirect'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-auth-redirect.yml
          git commit -m 'Remove temporary auth redirect workflow'
          git push
