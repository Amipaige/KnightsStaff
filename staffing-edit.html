<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}.event-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.event-actions button{width:auto!important;display:inline-block!important;padding:8px 11px!important;margin:0!important;border:0!important;border-radius:8px!important;font-size:12px!important;font-weight:700!important;cursor:pointer}.edit-event{background:#b59a63!important;color:#171716!important}.delete-event{background:#9a4b42!important;color:#fff!important}.edit-box{position:fixed;z-index:99999;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.edit-panel{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fffdf9;border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:Arial,sans-serif}.edit-panel h2{font:24px Georgia,serif;margin:0 0 14px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-panel label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}.edit-panel input,.edit-panel textarea{width:100%;padding:11px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px;box-sizing:border-box}.edit-panel textarea{min-height:90px;resize:vertical}.edit-buttons{display:flex;gap:8px;margin-top:14px}.edit-buttons button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700}.save-edit{background:#b59a63}.cancel-edit{background:#171716;color:#fff}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}}</style></head><body><iframe id="app" src="staffing-v2.html"></iframe><script>(function(){const frame=document.getElementById('app');const SB_URL='https://jpjrsndbjklecvwiuvbf.supabase.co';const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2...';function dbFor(d){const s=d.defaultView.supabase;return s?.createClient?s.createClient(SB_URL,'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2...'):null}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getDb(d){return d.defaultView.supabase?.createClient?d.defaultView.supabase.createClient(SB_URL,'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2...'):null}function inject(d){const obs=new MutationObserver(()=>{const admin=d.getElementById('adminView');if(admin&&!admin.classList.contains('hidden'))addButtons(d)});obs.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setTimeout(()=>addButtons(d),1200)}function addButtons(d){const admin=d.getElementById('adminView');if(!admin||admin.classList.contains('hidden'))return;d.querySelectorAll('#adminEvents .card').forEach(card=>{if(card.querySelector('.event-actions'))return;if(!card.querySelector('.event'))return;const box=d.createElement('div');box.className='event-actions';const e=card.querySelector('.event')?.textContent?.trim()||'';const b1=d.createElement('button');b1.className='edit-event';b1.textContent='✏️ Amend event';b1.onclick=()=>openEdit(d,card);const b2=d.createElement('button');b2.className='delete-event';b2.textContent='🗑️ Delete event';b2.onclick=()=>deleteEvent(d,card);box.append(b1,b2);card.appendChild(box)})}function field(label,id,value,type='text'){return '<div><label>'+label+'</label><input id="edit_'+id+'" type="'+type+'" value="'+esc(value||'')+'"></div>'}function openEdit(d,card){const eventName=card.querySelector('.event')?.textContent?.trim()||'';const dateText=card.querySelector('.date')?.textContent?.trim()||'';const db=getDb(d);if(!db){alert('Database connection unavailable.');return}const modal=d.createElement('div');modal.className='edit-box';modal.innerHTML='<div class="edit-panel"><h2>Amend event</h2><div id="editForm"></div><div class="edit-buttons"><button class="cancel-edit" type="button">Cancel</button><button class="save-edit" type="button">Save changes</button></div><p id="editMsg" class="small"></p></div>';d.body.appendChild(modal);const form=modal.querySelector('#editForm');form.innerHTML=field('Event name','name',eventName)+'<div class="edit-grid">'+field('Date','date','','date')+field('Staff required','staff','','number')+'</div>'+field('Venue / location','venue')+'<div class="edit-grid">'+field('Staff arrival','arrival','','time')+field('Bar start','start','','time')+'</div><div class="edit-grid">'+field('Finish','finish','','time')+field('Bar Manager','manager')+'</div>'+field('Bar / package','package')+field('Dress code','dress')+'<label>Notes</label><textarea id="edit_notes"></textarea>';modal.querySelector('.cancel-edit').onclick=()=>modal.remove();(async()=>{const r=await db.from('bar_events').select('*').eq('event_name',eventName).order('event_date').limit(10);if(r.error||!r.data?.length){modal.querySelector('#editMsg').textContent='Could not load this event.';return}let ev=r.data.find(x=>formatDate(d,x.event_date)===dateText)||r.data[0];modal.dataset.id=ev.id;d.getElementById('edit_date').value=ev.event_date||'';d.getElementById('edit_staff').value=ev.staff_required||'';d.getElementById('edit_venue').value=ev.venue||'';d.getElementById('edit_arrival').value=ev.arrival_time||'';d.getElementById('edit_start').value=ev.start_time||'';d.getElementById('edit_finish').value=ev.finish_time||'';d.getElementById('edit_manager').value=ev.manager_name||'';d.getElementById('edit_package').value=ev.bar_package||'';d.getElementById('edit_dress').value=ev.dress_code||'';d.getElementById('edit_notes').value=ev.notes||''})();modal.querySelector('.save-edit').onclick=async()=>{const id=modal.dataset.id;if(!id){modal.querySelector('#editMsg').textContent='Event is still loading…';return}const update={event_name:d.getElementById('edit_name').value.trim(),event_date:d.getElementById('edit_date').value,staff_required:Number(d.getElementById('edit_staff').value),venue:d.getElementById('edit_venue').value.trim(),arrival_time:d.getElementById('edit_arrival').value||null,start_time:d.getElementById('edit_start').value||null,finish_time:d.getElementById('edit_finish').value||null,manager_name:d.getElementById('edit_manager').value.trim()||'Not assigned',bar_package:d.getElementById('edit_package').value.trim(),dress_code:d.getElementById('edit_dress').value.trim(),notes:d.getElementById('edit_notes').value.trim()};if(!update.event_name||!update.event_date||!update.venue){modal.querySelector('#editMsg').textContent='Event name, date and venue are required.';return}const m=update.manager_name;const mr=await db.from('staff_profiles').select('id,full_name').ilike('full_name',m).maybeSingle();if(!mr.error&&mr.data)update.manager_id=mr.data.id;else update.manager_id=null;const r=await db.from('bar_events').update(update).eq('id',id);if(r.error){modal.querySelector('#editMsg').textContent='Could not save: '+r.error.message;return}modal.remove();location.reload()}}function formatDate(d,date){return new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}async function deleteEvent(d,card){const name=card.querySelector('.event')?.textContent?.trim()||'this event';const dateText=card.querySelector('.date')?.textContent?.trim()||'';if(!confirm('Delete '+name+' on '+dateText+'?\n\nThis will also remove all staff sign-ups for this event.'))return;const db=getDb(d);if(!db){alert('Database connection unavailable.');return}try{const r=await db.from('bar_events').select('id').eq('event_name',name).order('event_date').limit(10);if(r.error)throw r.error;const ev=r.data?.find(x=>formatDate(d,x.event_date)===dateText)||r.data?.[0];if(!ev)throw new Error('Event not found.');const s=await db.from('shift_signups').delete().eq('event_id',ev.id);if(s.error)throw s.error;const e=await db.from('bar_events').delete().eq('id',ev.id);if(e.error)throw e.error;location.reload()}catch(e){alert('Could not delete event: '+e.message)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;if(d)inject(d)})})();</script></body></html>
