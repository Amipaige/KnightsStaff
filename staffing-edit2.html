<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}.event-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.event-actions button{width:auto!important;display:inline-block!important;padding:8px 11px!important;margin:0!important;border:0!important;border-radius:8px!important;font-size:12px!important;font-weight:700!important;cursor:pointer}.edit-event{background:#b59a63!important;color:#171716!important}.delete-event{background:#9a4b42!important;color:#fff!important}.edit-box{position:fixed;z-index:99999;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.edit-panel{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fffdf9;border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:Arial,sans-serif}.edit-panel h2{font:24px Georgia,serif;margin:0 0 14px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-panel label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}.edit-panel input,.edit-panel textarea{width:100%;padding:11px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px;box-sizing:border-box}.edit-panel textarea{min-height:90px;resize:vertical}.edit-buttons{display:flex;gap:8px;margin-top:14px}.edit-buttons button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700}.save-edit{background:#b59a63}.cancel-edit{background:#171716;color:#fff}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}}</style></head><body><iframe id="app" src="staffing-v2.html"></iframe><script>(function(){const frame=document.getElementById('app');const U='https://jpjrsndbjklecvwiuvbf.supabase.co';const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2...';function getDb(){return frame.contentWindow.supabase.createClient(U,K)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(x){return new Date(x+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}function add(){const d=frame.contentDocument,a=d.getElementById('adminView');if(!a||a.classList.contains('hidden'))return;d.querySelectorAll('#adminEvents .card').forEach(c=>{if(c.querySelector('.event-actions')||!c.querySelector('.event'))return;const box=d.createElement('div');box.className='event-actions';const e=d.createElement('button');e.className='edit-event';e.textContent='✏️ Amend event';e.onclick=()=>edit(d,c);const x=d.createElement('button');x.className='delete-event';x.textContent='🗑️ Delete event';x.onclick=()=>del(d,c);box.append(e,x);c.appendChild(box)})}function watch(){const d=frame.contentDocument;if(!d)return;new MutationObserver(add).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});setTimeout(add,1000)}async function findEvent(db,c){const n=c.querySelector('.event')?.textContent.trim(),dt=c.querySelector('.date')?.textContent.trim();const r=await db.from('bar_events').select('*').eq('event_name',n).order('event_date');if(r.error)throw r.error;return r.data?.find(e=>fmt(e.event_date)===dt)||r.data?.[0]}function inp(id,label,val,type='text'){return '<div><label>'+label+'</label><input id="ee_'+id+'" type="'+type+'" value="'+esc(val||'')+'"></div>'}async function edit(d,c){const db=getDb(),ev=await findEvent(db,c);if(!ev)return alert('Event not found.');const m=d.createElement('div');m.className='edit-box';m.innerHTML='<div class="edit-panel"><h2>Amend event</h2>'+inp('name','Event name',ev.event_name)+'<div class="edit-grid">'+inp('date','Date',ev.event_date,'date')+inp('staff','Staff required',ev.staff_required,'number')+'</div>'+inp('venue','Venue / location',ev.venue)+'<div class="edit-grid">'+inp('arrival','Staff arrival',ev.arrival_time,'time')+inp('start','Bar start',ev.start_time,'time')+'</div><div class="edit-grid">'+inp('finish','Finish',ev.finish_time,'time')+inp('manager','Bar Manager',ev.manager_name)+'</div>'+inp('package','Bar / package',ev.bar_package)+inp('dress','Dress code',ev.dress_code)+'<label>Notes</label><textarea id="ee_notes">'+esc(ev.notes||'')+'</textarea><div class="edit-buttons"><button class="cancel-edit">Cancel</button><button class="save-edit">Save changes</button></div><p id="ee_msg" class="small"></p></div>';d.body.appendChild(m);m.querySelector('.cancel-edit').onclick=()=>m.remove();m.querySelector('.save-edit').onclick=async()=>{const u={event_name:d.getElementById('ee_name').value.trim(),event_date:d.getElementById('ee_date').value,staff_required:Number(d.getElementById('ee_staff').value),venue:d.getElementById('ee_venue').value.trim(),arrival_time:d.getElementById('ee_arrival').value||null,start_time:d.getElementById('ee_start').value||null,finish_time:d.getElementById('ee_finish').value||null,manager_name:d.getElementById('ee_manager').value.trim()||'Not assigned',bar_package:d.getElementById('ee_package').value.trim(),dress_code:d.getElementById('ee_dress').value.trim(),notes:d.getElementById('ee_notes').value.trim()};if(!u.event_name||!u.event_date||!u.venue){d.getElementById('ee_msg').textContent='Event name, date and venue are required.';return}const mr=await db.from('staff_profiles').select('id,full_name').ilike('full_name',u.manager_name).maybeSingle();u.manager_id=(!mr.error&&mr.data)?mr.data.id:null;const r=await db.from('bar_events').update(u).eq('id',ev.id);if(r.error){d.getElementById('ee_msg').textContent=r.error.message;return}m.remove();frame.contentWindow.location.reload()}}async function del(d,c){const db=getDb(),n=c.querySelector('.event')?.textContent.trim(),dt=c.querySelector('.date')?.textContent.trim();if(!confirm('Delete '+n+' on '+dt+'?\n\nAll staff sign-ups for this event will also be removed.'))return;try{const ev=await findEvent(db,c);if(!ev)throw Error('Event not found.');let r=await db.from('shift_signups').delete().eq('event_id',ev.id);if(r.error)throw r.error;r=await db.from('bar_events').delete().eq('id',ev.id);if(r.error)throw r.error;frame.contentWindow.location.reload()}catch(e){alert('Could not delete event: '+e.message)}}frame.addEventListener('load',watch)})();</script></body></html>
