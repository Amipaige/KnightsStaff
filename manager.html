<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Manager Shifts</title><style>:root{--ink:#171716;--cream:#f6f1e8;--paper:#fffdf9;--gold:#b59a63;--muted:#777166;--line:#e5ddd0;--green:#3d7558}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 70px}.head{background:var(--ink);color:#fff;border-radius:18px;padding:24px 20px;margin-bottom:14px}.brand{font:32px Georgia,serif;letter-spacing:.12em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em;margin-top:5px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;margin:12px 0}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:4px 0 8px}.small{font-size:13px;color:var(--muted);line-height:1.5}.date{font-size:13px;color:var(--muted)}.event{font:22px Georgia,serif;margin-top:3px}.meta{font-size:14px;color:var(--muted);line-height:1.7;margin-top:10px}.manager{font-size:14px;margin-top:8px}.badge{display:inline-block;padding:6px 9px;border-radius:20px;background:#dfeee5;color:var(--green);font-size:12px;font-weight:700}.btn{display:inline-block;text-decoration:none;padding:11px 14px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;margin-top:10px}.gold{background:var(--gold)}.empty{text-align:center;padding:20px;color:var(--muted)}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.back{font-size:12px}.error{color:#9a4b42}.hidden{display:none}@media(max-width:600px){.top{display:block}} </style></head><body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><div id="loading" class="card"><b>Loading your manager shifts…</b></div><main id="content" class="hidden"><div class="top"><div><h1 id="hello">Manager Shifts</h1><div class="small">Events where you are assigned as Bar Manager</div></div><a class="btn back" href="staffing.html">← All Staff Shifts</a></div><section><div id="managerEvents"></div></section></main><div id="login" class="card hidden"><h2>Sign in required</h2><p class="small">Please sign in to the Knights staff app first, then open this page again.</p><a class="btn gold" href="staffing.html">Open Staff App</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(async function(){const URL='https://jpjrsndbjklecvwiuvbf.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6ImpwanJzbmRiamtsZWN2d2l1dmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzQ1MTQsImV4cCI6MjEwMjExMDUxNH0.KrNOCgc71pyc7vNgWdy9juQCz5PiEl0oIQ52QFv-9FE';const db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';const timeFmt=t=>t?t.slice(0,5):'—';try{const session=await db.auth.getSession();const user=session.data.session?.user;if(!user){$('loading').classList.add('hidden');$('login').classList.remove('hidden');return}const p=await db.from('staff_profiles').select('full_name').eq('id',user.id).maybeSingle();if(p.error)throw p.error;const name=p.data?.full_name||user.email;$('hello').textContent='Hi, '+name;$('loading').classList.add('hidden');$('content').classList.remove('hidden');const r=await db.from('bar_events').select('*').eq('manager_id',user.id).gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(r.error)throw r.error;const events=r.data||[];$('managerEvents').innerHTML=events.length?events.map(e=>`<div class="card"><div class="top"><div><div class="date">${dateFmt(e.event_date)}</div><div class="event">${esc(e.event_name)}</div></div><span class="badge">BAR MANAGER</span></div><div class="meta">📍 ${esc(e.venue)}<br>🕐 Arrival ${timeFmt(e.arrival_time)} · ${timeFmt(e.start_time)}–${timeFmt(e.finish_time)}</div><div class="manager">👑 You are the Bar Manager for this event</div>${e.bar_package?`<div class="small">${esc(e.bar_package)}</div>`:''}${e.dress_code?`<div class="small">Dress: ${esc(e.dress_code)}</div>`:''}${e.notes?`<div class="small">${esc(e.notes)}</div>`:''}</div>`).join(''):'<div class="card empty"><b>No manager shifts assigned yet.</b><div class="small">When Knights assigns you as Bar Manager, the event will appear here automatically.</div></div>'} }catch(e){$('loading').classList.add('hidden');$('content').classList.remove('hidden');$('managerEvents').innerHTML='<div class="card error">Could not load your manager shifts: '+esc(e.message)+'</div>'}})();</script></body></html>
