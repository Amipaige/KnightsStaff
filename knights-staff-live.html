<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>:root{--ink:#171716;--cream:#f6f1e8;--paper:#fffdf9;--gold:#b59a63;--muted:#777166;--line:#e5ddd0;--red:#9a4b42;--green:#3d7558}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 18px 70px}.head{background:var(--ink);color:#fff;border-radius:20px;padding:28px 22px;text-align:center}.brand{font:36px Georgia,serif;letter-spacing:.12em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em;margin-top:7px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}.hidden{display:none!important}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;margin-top:13px;font-size:15px;cursor:pointer}.gold{background:var(--gold)}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.link{display:block;width:100%;border:0;background:transparent;color:var(--ink);font-weight:700;padding:14px 0 3px;cursor:pointer}.msg{min-height:24px;margin:14px 0 0;white-space:pre-line;line-height:1.45}.error{color:var(--red)}.success{color:var(--green)}.notice{padding:12px;border-radius:10px;background:#f8f0df;border:1px solid #e7d5ac;font-size:13px;line-height:1.45;margin-bottom:10px}</style></head><body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><section class="card"><div id="loginView"><h1>Knights Staff</h1><p class="muted">Sign in to view and request shifts.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">Sign in</button><button class="link" id="forgotBtn">Forgot your password?</button><button class="btn gold" id="createBtn">Create account</button></div><div id="forgotView" class="hidden"><h1>Reset your password</h1><p class="muted">Enter your Knights account email and we'll send you a secure reset link.</p><label>Email</label><input id="resetEmail" type="email"><button class="btn gold" id="sendReset">Send reset email</button><button class="btn light" id="backForgot">Back to sign in</button></div><div id="signupView" class="hidden"><h1>Create account</h1><div class="notice">New starters must complete the Knights New Starter Form before booking shifts.</div><label>Full name</label><input id="name"><label>Email</label><input id="signupEmail" type="email"><label>Password</label><input id="signupPassword" type="password"><button class="btn gold" id="signupBtn">Create account</button><button class="btn light" id="backSignup">Back to sign in</button></div><div id="recoveryView" class="hidden"><h1>Choose a new password</h1><label>New password</label><input id="newPassword" type="password"><label>Confirm new password</label><input id="confirmPassword" type="password"><button class="btn gold" id="updatePassword">Update password</button></div><p id="msg" class="msg"></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(function(){const U='https://jpjrsndbjklecvwiuvbf.supabase.co',K='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7',APP='staffing-v2-core.html?build=20260830-1400',$=id=>document.getElementById(id);const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const show=id=>['loginView','forgotView','signupView','recoveryView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));const msg=(t,ok=false)=>{$('msg').className='msg '+(ok?'success':'error');$('msg').textContent=t};const error=(e,stage)=>{const r=String(e?.message||e||''),l=r.toLowerCase();let c='KN-SYSTEM-001',t='We could not complete that action. Please try again.';if(l.includes('invalid login credentials')){c='KN-AUTH-001';t='The email or password is incorrect.'}else if(l.includes('email not confirmed')){c='KN-AUTH-002';t='Please verify your email address before signing in.'}else if(l.includes('rate limit')||l.includes('too many')){c='KN-AUTH-003';t='Too many sign-in attempts. Please wait a few minutes and try again.'}else if(stage==='PROFILE'){c='KN-PROFILE-001';t='Login succeeded, but your staff profile could not be loaded.'}else if(stage==='DATA'){c='KN-DATA-001';t='Login succeeded, but your shifts could not be loaded.'}return t+'\nError code: '+c};async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return msg('Enter your email and password.');$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.replace(APP)}catch(e){msg(error(e,'AUTH'));$('loginBtn').disabled=false}}async function reset(){const email=$('resetEmail').value.trim().toLowerCase();if(!email)return msg('Enter your email address.');try{const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)throw r.error;msg('If that email is registered with Knights, a password reset email has been sent. Check your inbox and spam/junk.',true)}catch(e){msg(error(e,'AUTH'))}}async function signup(){const name=$('name').value.trim(),email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value;if(!name||!email)return msg('Enter your full name and email.');if(password.length<8)return msg('Password must be at least 8 characters.');try{const r=await db.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.href.split('#')[0]}});if(r.error)throw r.error;msg('Account created. Check your email to verify your account, then sign in.',true)}catch(e){msg(error(e,'AUTH'))}}async function updatePassword(){const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<8)return msg('Your new password must be at least 8 characters.');if(a!==b)return msg('The passwords do not match.');try{const r=await db.auth.updateUser({password:a});if(r.error)throw r.error;msg('Password updated. Please sign in again.',true);setTimeout(()=>show('loginView'),800)}catch(e){msg(error(e,'AUTH'))}}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('forgotBtn').onclick=()=>{show('forgotView');$('resetEmail').value=$('email').value};$('backForgot').onclick=()=>show('loginView');$('createBtn').onclick=()=>show('signupView');$('backSignup').onclick=()=>show('loginView');$('sendReset').onclick=reset;$('signupBtn').onclick=signup;$('updatePassword').onclick=updatePassword;const h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('type')==='recovery')show('recoveryView')})()</script></body></html>
