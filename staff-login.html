<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knights Staff Login</title>
<style>
:root{--ink:#171716;--cream:#f6f1e8;--paper:#fffdf9;--gold:#b59a63;--muted:#777166;--line:#e5ddd0;--red:#9a4b42;--green:#3d7558}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 18px 70px}.head{background:var(--ink);color:#fff;border-radius:20px;padding:28px 22px;margin-bottom:18px;text-align:center}.brand{font:36px Georgia,serif;letter-spacing:.12em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em;margin-top:7px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}.hidden{display:none!important}.muted,.small{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;margin-top:13px;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55}.gold{background:var(--gold)}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.link{display:block;width:100%;border:0;background:transparent;color:var(--ink);font-weight:700;padding:14px 0 3px;cursor:pointer}.msg{min-height:24px;margin:14px 0 0;white-space:pre-line;line-height:1.45}.error{color:var(--red)}.success{color:var(--green)}.notice{padding:12px;border-radius:10px;background:#f8f0df;border:1px solid #e7d5ac;font-size:13px;line-height:1.45;margin-bottom:10px}
</style>
</head>
<body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><section class="card">
<div id="loginView"><h1>Knights Staff</h1><p class="muted">Sign in to view and request shifts.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"><button class="btn" id="loginBtn" type="button">Sign in</button><button class="link" id="forgotBtn" type="button">Forgot your password?</button><button class="btn gold" id="createBtn" type="button">Create account</button></div>
<div id="forgotView" class="hidden"><h1>Reset your password</h1><p class="muted">Enter your Knights account email and we'll send you a secure password reset link.</p><label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com"><button class="btn gold" id="sendResetBtn" type="button">Send reset email</button><button class="btn light" id="backBtn" type="button">Back to sign in</button></div>
<div id="recoveryView" class="hidden"><h1>Choose a new password</h1><div class="notice">Set a new password for your Knights account. Use at least 8 characters.</div><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="New password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password"><button class="btn gold" id="updatePasswordBtn" type="button">Update password</button></div><p id="msg" class="msg"></p></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async function(){
const $=id=>document.getElementById(id);const msg=(text,type='error')=>{$('msg').textContent=text;$('msg').className='msg '+type};const code=(a,b)=>'KN-'+a+'-'+b;
function show(view){['loginView','forgotView','recoveryView'].forEach(id=>$(id).classList.toggle('hidden',id!==view));msg('')}
let db;
try{const source=await fetch('staffing.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load staff app configuration');return r.text()});const m=source.match(/const URL='([^']+)',KEY='([^']+)'/);if(!m)throw new Error('Supabase configuration was not found');db=window.supabase.createClient(m[1],m[2])}catch(e){msg('We could not start the Knights login system. Please refresh the page.\nError code: '+code('SYSTEM','001'));console.error(e);return}
function friendly(e,area){const raw=String(e?.message||e||'');if(/invalid login credentials/i.test(raw))return 'The email or password is incorrect.\nError code: '+code('AUTH','001');if(/email not confirmed|not confirmed/i.test(raw))return 'Please verify your email address before signing in.\nError code: '+code('AUTH','002');if(/rate limit|too many requests/i.test(raw))return 'Too many attempts. Please wait a few minutes and try again.\nError code: '+code('AUTH','003');if(/network|fetch/i.test(raw))return 'We could not connect to Knights. Check your connection and try again.\nError code: '+code('SYSTEM','002');console.error('Knights '+area,e);return 'We could not complete that action. Please try again.\nError code: '+code(area,'001')}
async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return msg('Enter your email and password.');$('loginBtn').disabled=true;msg('Signing in…','');try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.user?.id)throw new Error('Authentication succeeded without a user id');msg('Login successful. Loading your staff account…','success');window.location.replace('staffing.html')}catch(e){msg(friendly(e,'AUTH'))}finally{$('loginBtn').disabled=false}}
async function sendReset(){const email=$('resetEmail').value.trim().toLowerCase();if(!email)return msg('Enter your account email.');$('sendResetBtn').disabled=true;msg('Sending reset email…','');try{const r=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;msg('If that email is registered with Knights, a password reset link has been sent. Check your inbox and spam/junk.','success')}catch(e){msg(friendly(e,'AUTH'))}finally{$('sendResetBtn').disabled=false}}
async function updatePassword(){const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<8)return msg('Your new password must be at least 8 characters.');if(a!==b)return msg('The two passwords do not match.');$('updatePasswordBtn').disabled=true;msg('Updating password…','');try{const r=await db.auth.updateUser({password:a});if(r.error)throw r.error;msg('Password updated successfully. Taking you to the staff app…','success');setTimeout(()=>window.location.replace('staffing.html'),700)}catch(e){msg(friendly(e,'AUTH'))}finally{$('updatePasswordBtn').disabled=false}}
$('loginBtn').onclick=login;$('forgotBtn').onclick=()=>{$('resetEmail').value=$('email').value.trim();show('forgotView');$('resetEmail').focus()};$('sendResetBtn').onclick=sendReset;$('backBtn').onclick=()=>show('loginView');$('updatePasswordBtn').onclick=updatePassword;$('createBtn').onclick=()=>window.location.replace('staffing.html');$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('resetEmail').addEventListener('keydown',e=>{if(e.key==='Enter')sendReset()});const hash=new URLSearchParams(location.hash.replace(/^#/,''));if(hash.get('type')==='recovery')show('recoveryView');else db.auth.getSession().then(({data})=>{if(data.session)window.location.replace('staffing.html')}).catch(e=>msg('We could not restore your session.\nError code: '+code('SESSION','001')));
})();
</script></body></html>
