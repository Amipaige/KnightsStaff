<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}.event-actions{display:flex!important;gap:8px!important;flex-wrap:wrap!important;margin-top:12px!important}.event-action{width:auto!important;display:inline-block!important;padding:9px 13px!important;margin:0!important;border:0!important;border-radius:8px!important;color:#fff!important;font-weight:700!important;font-size:13px!important;cursor:pointer!important}.event-edit{background:#b59a63!important}.event-delete{background:#9a4b42!important}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}.modal{background:#fffdf9;max-width:650px;width:100%;max-height:92vh;overflow:auto;border-radius:16px;padding:20px;box-sizing:border-box;font-family:Arial,sans-serif}.modal h2{font-family:Georgia,serif;font-weight:500;margin:0 0 12px}.modal label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.modal input,.modal textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd2c2;border-radius:8px;font-size:16px;background:#fff}.modal textarea{min-height:80px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.m-actions{display:flex;gap:8px;margin-top:16px}.m-actions button{flex:1;padding:12px;border:0;border-radius:8px;font-weight:700}.save{background:#b59a63;color:#fff}.cancel{background:#ddd;color:#222}@media(max-width:600px){.mgrid{grid-template-columns:1fr}}</style></head><body><iframe id="app" src="staffing-v2-core.html"></iframe><div id="modalBg" class="modal-bg"><div class="modal"><h2>Amend event</h2><form id="editForm"><input id="eid" type="hidden"><label>Event name</label><input id="ename"><div class="mgrid"><div><label>Date</label><input id="edate" type="date"></div><div><label>Staff required</label><input id="erequired" type="number" min="1"></div></div><label>Venue / location</label><input id="evenue"><div class="mgrid"><div><label>Staff arrival</label><input id="earrival" type="time"></div><div><label>Bar start</label><input id="estart" type="time"></div></div><div class="mgrid"><div><label>Finish</label><input id="efinish" type="time"></div><div><label>Bar Manager</label><input id="emanager" list="managerList"><datalist id="managerList"></datalist></div></div><label>Bar / package</label><input id="epackage"><label>Dress code</label><input id="edress"><label>Notes</label><textarea id="enotes"></textarea><div class="m-actions"><button type="button" class="cancel" id="closeEdit">Cancel</button><button type="submit" class="save">Save changes</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(function(){const frame=document.getElementById('app'),bg=document.getElementById('modalBg'),form=document.getElementById('editForm');const URL='https://jpjrsndbjklecvwiuvbf.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJqd2pya3NuZGJqa2xld3ZpdXZib2YiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjUzNDUxNCwiZXhwIjoyMTAyMTEwNTE0fQ.KrNOCgc71pyc7vNgWdy9juQCz5PiEl0oIQ52QFv-9FE';let db,lastSig='',events=[];function getDb(){return db||(db=window.supabase.createClient(URL,KEY))}function openModal(e){document.getElementById('eid').value=e.id;document.getElementById('ename').value=e.event_name||'';document.getElementById('edate').value=e.event_date||'';document.getElementById('erequired').value=e.staff_required||1;document.getElementById('evenue').value=e.venue||'';document.getElementById('earrival').value=e.arrival_time?e.arrival_time.slice(0,5):'';document.getElementById('estart').value=e.start_time?e.start_time.slice(0,5):'';document.getElementById('efinish').value=e.finish_time?e.finish_time.slice(0,5):'';document.getElementById('emanager').value=e.manager_name||'';document.getElementById('epackage').value=e.bar_package||'';document.getElementById('edress').value=e.dress_code||'';document.getElementById('enotes').value=e.notes||'';bg.style.display='flex';loadManagers()}async function loadManagers(){const r=await getDb().from('staff_profiles').select('full_name').order('full_name');if(!r.error)document.getElementById('managerList').innerHTML=(r.data||[]).map(x=>'<option value="'+String(x.full_name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></option>').join('')}async function enhance(){const d=frame.contentDocument;if(!d)return;const admin=d.getElementById('adminView');if(!admin||admin.classList.contains('hidden'))return;const list=d.getElementById('adminEvents');if(!list)return;const cards=[...list.children].filter(x=>x.classList.contains('card'));if(!cards.length)return;const r=await getDb().from('bar_events').select('*').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(r.error)return;events=r.data||[];cards.forEach((card,i)=>{if(card.querySelector('.event-actions'))return;const e=events[i];if(!e)return;const a=d.createElement('div');a.className='event-actions';const edit=d.createElement('button');edit.className='event-action event-edit';edit.type='button';edit.textContent='✏️ Amend event';edit.onclick=()=>openModal(e);const del=d.createElement('button');del.className='event-action event-delete';del.type='button';del.textContent='🗑️ Delete event';del.onclick=()=>deleteEvent(e);a.append(edit,del);card.appendChild(a)})}async function deleteEvent(e){if(!confirm('Delete “'+e.event_name+'”? This will also remove all staff bookings for this event.'))return;const d=getDb(),s=await d.from('shift_signups').delete().eq('event_id',e.id);if(s.error){alert('Could not remove staff bookings: '+s.error.message);return}const r=await d.from('bar_events').delete().eq('id',e.id);if(r.error){alert('Could not delete event: '+r.error.message);return}alert('Event deleted.');frame.contentWindow.location.reload()}form.addEventListener('submit',async function(ev){ev.preventDefault();const id=document.getElementById('eid').value;const payload={event_name:document.getElementById('ename').value.trim(),event_date:document.getElementById('edate').value,staff_required:Math.max(1,Number(document.getElementById('erequired').value)||1),venue:document.getElementById('evenue').value.trim(),arrival_time:document.getElementById('earrival').value||null,start_time:document.getElementById('estart').value||null,finish_time:document.getElementById('efinish').value||null,manager_name:document.getElementById('emanager').value.trim()||'Not assigned',bar_package:document.getElementById('epackage').value.trim(),dress_code:document.getElementById('edress').value.trim(),notes:document.getElementById('enotes').value.trim()};if(!payload.event_name||!payload.event_date||!payload.venue){alert('Please complete the event name, date and venue.');return}const r=await getDb().from('bar_events').update(payload).eq('id',id);if(r.error){alert('Could not amend event: '+r.error.message);return}bg.style.display='none';alert('Event amended successfully.');frame.contentWindow.location.reload()});document.getElementById('closeEdit').onclick=()=>bg.style.display='none';bg.addEventListener('click',e=>{if(e.target===bg)bg.style.display='none'});frame.addEventListener('load',function(){new MutationObserver(()=>enhance().catch(()=>{})).observe(frame.contentDocument.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setInterval(()=>enhance().catch(()=>{}),1000);enhance().catch(()=>{})})})();</script></body></html>
