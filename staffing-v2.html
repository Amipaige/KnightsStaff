<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}.admin-remove{width:auto!important;display:inline-block!important;padding:6px 9px!important;margin:4px 0 0 6px!important;font-size:11px!important;background:#9a4b42!important;color:#fff!important;border:0!important;border-radius:7px!important;font-weight:700!important;cursor:pointer}.admin-add-card{border:1px solid #e5ddd0!important;background:#fffdf9!important}.admin-add-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}.admin-add-grid select{width:100%!important;padding:12px!important;border:1px solid #ddd2c2!important;border-radius:9px!important;background:#fff!important;font-size:16px!important}@media(max-width:600px){.admin-add-grid{grid-template-columns:1fr!important}}</style></head><body><iframe id="app" src="staffing-v2-core.html"></iframe><script>(function(){const frame=document.getElementById('app');frame.addEventListener('load',function(){const d=frame.contentDocument;if(!d)return;const name=d.getElementById('name');if(name){const labels=[...d.querySelectorAll('label')];const label=labels.find(x=>x.textContent.trim()==='Full name');name.style.display='none';if(label)label.style.display='none';const login=d.getElementById('loginBtn');const signupBtn=d.getElementById('signupBtn');if(login&&signupBtn){let signup=false;const original=signupBtn.onclick;const back=d.createElement('button');back.type='button';back.textContent='Back to sign in';back.className='btn mini';back.style.display='none';signupBtn.parentNode.appendChild(back);function enter(){signup=true;name.style.display='block';if(label)label.style.display='block';login.style.display='none';signupBtn.textContent='Create account';back.style.display='inline-block';const h=d.querySelector('#auth h1');if(h)h.textContent='Create your Knights account';const p=d.querySelector('#auth>p.muted');if(p)p.textContent='Enter your name, email and password. You will need to complete the Knights registration form before booking shifts.'}function exit(){signup=false;name.style.display='none';if(label)label.style.display='none';login.style.display='block';signupBtn.textContent='Create account';back.style.display='none';const h=d.querySelector('#auth h1');if(h)h.textContent='Knights Staff';const p=d.querySelector('#auth>p.muted');if(p)p.textContent='Sign in to view and request shifts. New starters must complete the Knights registration form before booking.';const m=d.getElementById('msg');if(m)m.textContent=''}signupBtn.onclick=function(){if(!signup){enter();return}return original.call(this)};back.onclick=exit}}addRemoveButtons(d);addManualAdd(d)});function getDb(d){const sb=d.defaultView.supabase;return sb?.createClient?sb.createClient('https://jpjrsndbjklecvwiuvbf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwanJzbmRiamtsZWN2d2l1dmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzQ1MTQsImV4cCI6MjEwMjExMDUxNH0.KrNOCgc71pyc7vNgWdy9juQCz5PiEl0oIQ52QFv-9FE'):null}function addManualAdd(d){const observer=new MutationObserver(function(){const admin=d.getElementById('adminView');if(admin&&!admin.classList.contains('hidden'))ensureManualAdd(d)});observer.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setTimeout(function(){ensureManualAdd(d)},900)}async function ensureManualAdd(d){const admin=d.getElementById('adminView');if(!admin||admin.classList.contains('hidden')||d.getElementById('manualAddCard'))return;const card=d.createElement('div');card.id='manualAddCard';card.className='card admin-add-card';card.innerHTML='<h2>Add staff to a shift</h2><p class="small">Manually add an approved staff member directly to a shift. They will be added as <b>confirmed</b>.</p><div class="admin-add-grid"><div><label>Event</label><select id="manualEvent"><option value="">Loading events…</option></select></div><div><label>Staff member</label><select id="manualStaff"><option value="">Loading staff…</option></select></div></div><button class="btn gold" id="manualAddBtn" type="button">Add staff to shift</button><p id="manualAddMsg" class="msg"></p>';admin.insertBefore(card,admin.querySelector('#adminEvents'));try{const db=getDb(d);if(!db)throw new Error('Database connection unavailable.');const er=await db.from('bar_events').select('id,event_name,event_date,venue,staff_required').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(er.error)throw er.error;const sr=await db.from('staff_profiles').select('id,full_name,email,registration_status,role').order('full_name');if(sr.error)throw sr.error;const events=er.data||[],staff=(sr.data||[]).filter(x=>x.registration_status==='approved'||x.role==='admin');const ev=d.getElementById('manualEvent'),st=d.getElementById('manualStaff');ev.innerHTML=events.length?'<option value="">Choose an event…</option>'+events.map(e=>'<option value="'+e.id+'">'+esc2(e.event_name)+' — '+esc2(e.event_date)+' — '+esc2(e.venue||'')+'</option>').join(''):'<option value="">No upcoming events</option>';st.innerHTML=staff.length?'<option value="">Choose a staff member…</option>'+staff.map(x=>'<option value="'+x.id+'">'+esc2(x.full_name)+' — '+esc2(x.email||'')+'</option>').join(''):'<option value="">No approved staff</option>';d.getElementById('manualAddBtn').onclick=function(){manualAddStaff(d)};}catch(e){d.getElementById('manualAddMsg').textContent='Could not load: '+e.message}}function esc2(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function manualAddStaff(d){const ev=d.getElementById('manualEvent'),st=d.getElementById('manualStaff'),m=d.getElementById('manualAddMsg');if(!ev.value||!st.value){m.textContent='Choose an event and a staff member.';return}if(!confirm('Add '+st.options[st.selectedIndex].text.split(' — ')[0]+' to this shift as confirmed?'))return;const db=getDb(d);if(!db){m.textContent='Database connection unavailable.';return}const btn=d.getElementById('manualAddBtn');btn.disabled=true;m.textContent='Adding staff…';try{const existing=await db.from('shift_signups').select('id,status').eq('event_id',ev.value).eq('staff_id',st.value).maybeSingle();if(existing.error)throw existing.error;if(existing.data){if(existing.data.status!=='confirmed'){const u=await db.from('shift_signups').update({status:'confirmed'}).eq('id',existing.data.id);if(u.error)throw u.error}}else{const ins=await db.from('shift_signups').insert({event_id:ev.value,staff_id:st.value,status:'confirmed'});if(ins.error)throw ins.error}m.textContent='Staff member added successfully.';setTimeout(function(){location.reload()},500)}catch(e){m.textContent='Could not add staff: '+e.message}finally{btn.disabled=false}}function addRemoveButtons(d){const observer=new MutationObserver(function(){const admin=d.getElementById('adminView');if(admin&&!admin.classList.contains('hidden')){d.querySelectorAll('.staffline>div').forEach(function(row){if(row.querySelector('.admin-remove'))return;if(!row.querySelector('.badge'))return;const txt=row.firstChild?.textContent?.trim();if(!txt)return;const btn=d.createElement('button');btn.type='button';btn.className='admin-remove';btn.textContent='Remove';btn.dataset.staffName=txt;btn.addEventListener('click',function(){removeStaffFromShift(d,row,txt)});row.appendChild(btn)})}});observer.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setTimeout(function(){d.querySelectorAll('.staffline>div').forEach(function(row){if(row.querySelector('.admin-remove'))return;if(!row.querySelector('.badge'))return;const txt=row.firstChild?.textContent?.trim();if(!txt)return;const btn=d.createElement('button');btn.type='button';btn.className='admin-remove';btn.textContent='Remove';btn.dataset.staffName=txt;btn.addEventListener('click',function(){removeStaffFromShift(d,row,txt)});row.appendChild(btn)})},1200)}async function removeStaffFromShift(d,row,staffName){const card=row.closest('.card');if(!card)return;if(!confirm('Remove '+staffName+' from this shift?'))return;try{const dateText=card.querySelector('.date')?.textContent?.trim()||'';const eventName=card.querySelector('.event')?.textContent?.trim()||'';const parts=dateText.match(/^(?:\w+),\s*(\d+)\s+(\w+)\s+(\d{4})$/);if(!parts)throw new Error('Could not identify the event date.');const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11};const eventDate=parts[3]+'-'+String(months[parts[2]]+1).padStart(2,'0')+'-'+String(parts[1]).padStart(2,'0');const db=getDb(d);if(!db)throw new Error('Database connection unavailable.');const er=await db.from('bar_events').select('id').eq('event_name',eventName).eq('event_date',eventDate).maybeSingle();if(er.error)throw er.error;if(!er.data)throw new Error('Event not found.');const pr=await db.from('staff_profiles').select('id').eq('full_name',staffName).maybeSingle();if(pr.error)throw pr.error;if(!pr.data)throw new Error('Staff member not found.');const sr=await db.from('shift_signups').update({status:'cancelled'}).eq('event_id',er.data.id).eq('staff_id',pr.data.id);if(sr.error)throw sr.error;row.remove();const count=card.querySelector('.row .badge');if(count){const m=count.textContent.match(/(\d+)\/(\d+)/);if(m)count.textContent=(Number(m[1])-1)+'/'+m[2]+' staff'}alert(staffName+' has been removed from the shift.')}catch(e){alert('Could not remove staff: '+e.message)}}})();</script></body></html>
