<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}</style></head><body><iframe id="app" src="staffing-v2-core.html"></iframe><script>(function(){const frame=document.getElementById('app');frame.addEventListener('load',function(){const d=frame.contentDocument;const name=d.getElementById('name');if(!name)return;const labels=[...d.querySelectorAll('label')];const label=labels.find(x=>x.textContent.trim()==='Full name');let signup=false;name.style.display='none';if(label)label.style.display='none';const login=d.getElementById('loginBtn');const signupBtn=d.getElementById('signupBtn');if(!login||!signupBtn)return;const original=signupBtn.onclick;const back=d.createElement('button');back.type='button';back.textContent='Back to sign in';back.className='btn mini';back.style.display='none';signupBtn.parentNode.appendChild(back);function enter(){signup=true;name.style.display='block';if(label)label.style.display='block';login.style.display='none';signupBtn.textContent='Create account';back.style.display='inline-block';const h=d.querySelector('#auth h1');if(h)h.textContent='Create your Knights account';const p=d.querySelector('#auth>p.muted');if(p)p.textContent='Enter your name, email and password. You will need to complete the Knights registration form before booking shifts.'}function exit(){signup=false;name.style.display='none';if(label)label.style.display='none';login.style.display='block';signupBtn.textContent='Create account';back.style.display='none';const h=d.querySelector('#auth h1');if(h)h.textContent='Knights Staff';const p=d.querySelector('#auth>p.muted');if(p)p.textContent='Sign in to view and request shifts. New starters must complete the Knights registration form before booking.';const m=d.getElementById('msg');if(m)m.textContent=''}signupBtn.onclick=function(){if(!signup){enter();return}return original.call(this)};back.onclick=exit});})();</script></body></html>
