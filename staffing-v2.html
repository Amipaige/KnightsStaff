<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>html,body{margin:0;padding:0;background:#f6f1e8}iframe{display:block;width:100%;min-height:100vh;border:0}.event-actions{display:flex!important;gap:8px!important;flex-wrap:wrap!important;margin-top:12px!important}.event-action{width:auto!important;display:inline-block!important;padding:9px 13px!important;margin:0!important;border:0!important;border-radius:8px!important;color:#fff!important;font-weight:700!important;font-size:13px!important;cursor:pointer!important}.event-edit{background:#b59a63!important}.event-delete{background:#9a4b42!important}</style></head><body><iframe id="app" src="staffing-v2-core.html"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(function(){const frame=document.getElementById('app');const URL='https://jpjrsndbjklecvwiuvbf.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwanJzbmRiamtsZWN2d2l1dmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MzQ1MTQsImV4cCI6MjEwMjExMDUxNH0.KrNOCgc71pyc7vNgWdy9juQCz5PiEl0oIQ52QFv-9FE';let db=null,lastSignature='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getDb(){if(!db)db=window.supabase.createClient(URL,KEY);return db}function parseDate(text){const m=text.match(/^(?:\w+),\s*(\d+)\s+(\w+)\s+(\d{4})$/);if(!m)return null;const months={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Sept:9,Oct:10,Nov:11,Dec:12};const mo=months[m[2]];return mo?m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'):null}async function enhance(){const d=frame.contentDocument;if(!d)return;const admin=d.getElementById('adminView');if(!admin||admin.classList.contains('hidden'))return;const list=d.getElementById('adminEvents');if(!list)return;const cards=[...list.children].filter(x=>x.classList.contains('card'));if(!cards.length)return;const sig=cards.map(x=>(x.querySelector('.event')?.textContent||'')+'|'+(x.querySelector('.date')?.textContent||'')).join(';;');if(sig===lastSignature&&cards.every(c=>c.querySelector('.event-actions')))return;const r=await getDb().from('bar_events').select('*').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(r.error)return;const events=r.data||[];cards.forEach((card,i)=>{if(card.querySelector('.event-actions'))return;const e=events[i];if(!e)return;const actions=d.createElement('div');actions.className='event-actions';const edit=d.createElement('button');edit.type='button';edit.className='event-action event-edit';edit.textContent='✏️ Amend event';edit.onclick=()=>editEvent(d,e.id);const del=d.createElement('button');del.type='button';del.className='event-action event-delete';del.textContent='🗑️ Delete event';del.onclick=()=>deleteEvent(d,e.id,e.event_name);actions.append(edit,del);card.appendChild(actions)});lastSignature=sig}async function editEvent(d,id){const r=await getDb().from('bar_events').select('*').eq('id',id).single();if(r.error){alert(r.error.message);return}const e=r.data;const name=prompt('Event name:',e.event_name||'');if(name===null)return;const date=prompt('Date (YYYY-MM-DD):',e.event_date||'');if(date===null)return;const required=prompt('Number of staff required:',String(e.staff_required||1));if(required===null)return;const venue=prompt('Venue / location:',e.venue||'');if(venue===null)return;const arrival=prompt('Staff arrival time (HH:MM):',e.arrival_time?e.arrival_time.slice(0,5):'');if(arrival===null)return;const start=prompt('Bar start time (HH:MM):',e.start_time?e.start_time.slice(0,5):'');if(start===null)return;const finish=prompt('Finish time (HH:MM):',e.finish_time?e.finish_time.slice(0,5):'');if(finish===null)return;const manager=prompt('Bar Manager:',e.manager_name||'');if(manager===null)return;const pkg=prompt('Bar / package:',e.bar_package||'');if(pkg===null)return;const dress=prompt('Dress code:',e.dress_code||'');if(dress===null)return;const notes=prompt('Notes:',e.notes||'');if(notes===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Please use the date format YYYY-MM-DD.');return}const u=await getDb().from('bar_events').update({event_name:name,event_date:date,staff_required:Math.max(1,Number(required)||1),venue,arrival_time:arrival||null,start_time:start||null,finish_time:finish||null,manager_name:manager||'Not assigned',bar_package:pkg,dress_code:dress,notes}).eq('id',id);if(u.error){alert('Could not amend event: '+u.error.message);return}alert('Event amended successfully.');frame.contentWindow.location.reload()}async function deleteEvent(d,id,name){if(!confirm('Delete “'+name+'”? This will also remove all staff bookings for this event.'))return;const dbx=getDb();const s=await dbx.from('shift_signups').delete().eq('event_id',id);if(s.error){alert('Could not remove the staff bookings: '+s.error.message);return}const r=await dbx.from('bar_events').delete().eq('id',id);if(r.error){alert('Could not delete the event: '+r.error.message);return}alert('Event deleted.');frame.contentWindow.location.reload()}frame.addEventListener('load',function(){const observer=new MutationObserver(function(){enhance().catch(()=>{})});observer.observe(frame.contentDocument.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setInterval(()=>enhance().catch(()=>{}),1200);enhance().catch(()=>{})})})();</script></body></html>
