<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Knights Staff</title><style>:root{--ink:#171716;--cream:#f6f1e8;--paper:#fffdf9;--gold:#b59a63;--muted:#777166;--line:#e5ddd0;--green:#3d7558;--red:#9a4b42}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 80px}.head{background:var(--ink);color:#fff;border-radius:18px;padding:24px 20px;margin-bottom:14px}.brand{font:32px Georgia,serif;letter-spacing:.12em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em;margin-top:5px}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:29px;margin:8px 0 10px}h2{font-size:23px;margin:20px 0 10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #00000008}.hidden{display:none!important}.muted,.small{color:var(--muted)}.small{font-size:12px;line-height:1.5}.msg{min-height:22px;color:var(--red);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;margin-top:12px;font-size:15px}.gold{background:var(--gold)}label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px}textarea{min-height:85px}.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700}.tabs button.active{background:var(--ink);color:#fff}.event{font:21px Georgia,serif}.date{font-size:13px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{font-size:12px;font-weight:700;padding:6px 9px;border-radius:20px;background:#eee;white-space:nowrap}.approved{background:#dfeee5;color:var(--green)}.pending{background:#f4ead7;color:#7d642d}.need{background:#f4e3dc;color:var(--red)}.meta{font-size:14px;color:var(--muted);line-height:1.7;margin-top:9px}.manager{font-size:14px;margin-top:8px}.staffline{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:14px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font:26px Georgia,serif;display:block}.stat span{font-size:12px;color:var(--muted)}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{width:auto;padding:9px 12px;margin:0}.lock{border:1px solid #d9c8a1;background:#fffaf0;border-radius:12px;padding:16px;text-align:center}@media(max-width:600px){.grid,.statgrid{grid-template-columns:1fr}.row{display:block}.badge{display:inline-block;margin-top:8px}}</style></head><body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><section id="auth" class="card"><h1>Knights Staff</h1><p class="muted">Sign in to view and request shifts.</p><div id="nameBox"><label>Full name</label><input id="name" autocomplete="name" placeholder="Your full name"></div><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 8 characters"><div class="grid"><button class="btn" id="loginBtn" type="button">Sign in</button><button class="btn gold" id="signupBtn" type="button">Create account</button></div><p id="msg" class="msg"></p></section><section id="app" class="hidden"><div class="topline"><div><h1 id="hello">Knights Staff</h1><div id="status" class="small"></div></div><button class="btn logout" id="logoutBtn" type="button">Log out</button></div><div class="tabs"><button id="staffTab" class="active" type="button">Shifts</button><button id="adminTab" class="hidden" type="button">Admin</button></div><div id="staffView"><div id="staffGate" class="lock hidden"><b>Registration required</b><p class="small">Complete the Knights New Starter Form and wait for admin approval before requesting shifts.</p><button class="btn gold" type="button" onclick="window.open('https://forms.gle/PN2j7nMZTGgxkbP57','_blank')">Complete New Starter Form</button></div><div id="staffContent"></div></div><div id="adminView" class="hidden"><div class="statgrid"><div class="stat"><b id="eventCount">0</b><span>Upcoming events</span></div><div class="stat"><b id="openCount">0</b><span>Need staffing</span></div><div class="stat"><b id="pendingCount">0</b><span>Pending requests</span></div></div><div class="card"><h2>Create event</h2><label>Event name</label><input id="eventName" placeholder="Wedding / private event"><div class="grid"><div><label>Date</label><input id="eventDate" type="date"></div><div><label>Staff required</label><input id="staffRequired" type="number" min="1" value="3"></div></div><label>Venue / location</label><input id="venue" placeholder="Venue and town"><div class="grid"><div><label>Staff arrival</label><input id="arrival" type="time"></div><div><label>Bar start</label><input id="start" type="time"></div></div><div class="grid"><div><label>Finish</label><input id="finish" type="time"></div><div><label>Bar Manager</label><select id="manager"><option value="">Not assigned</option></select></div></div><label>Bar / package</label><input id="barPackage" placeholder="Luxury Bar / Pop-up / Stock & Staff"><label>Dress code</label><input id="dressCode" placeholder="Black trousers & white shirt"><label>Notes</label><textarea id="notes" placeholder="Parking, access, setup etc."></textarea><button class="btn gold" id="createEventBtn" type="button">Add event</button><p id="adminMsg" class="msg"></p></div><div id="adminEvents"></div><div class="card"><h2>Staff</h2><div id="staffList" class="small">Loading…</div></div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>(function(){const URL='https://jpjrsndbjklecvwiuvbf.supabase.co',KEY='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7';const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t,adminMsg=t=>$('adminMsg').textContent=t;let client,me,profile,events=[];client=window.supabase.createClient(URL,KEY);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateFmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):''}function timeFmt(t){return t?t.slice(0,5):'—'}async function signup(){let name=$('name').value.trim(),email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!name)return msg('Enter your full name.');if(!email.includes('@'))return msg('Enter a valid email address.');if(password.length<8)return msg('Password must be at least 8 characters.');let b=$('signupBtn');b.disabled=true;b.textContent='Creating…';msg('Creating account…');try{let r=await client.auth.signUp({email,password,options:{data:{full_name:name}}});if(r.error)throw r.error;if(r.data.user){let admin=email==='info@knightsmobilebars.co.uk';let p=await client.from('staff_profiles').upsert({id:r.data.user.id,email,full_name:name,registration_status:admin?'approved':'not_completed',role:admin?'admin':'staff'},{onConflict:'id'});if(p.error)throw p.error}if(r.data.session)await loadApp(r.data.user);else msg('Account created. Check your email to confirm it, then sign in.')}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='Create account'}}async function login(){let email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return msg('Enter your email and password.');let b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';msg('Signing in…');try{let r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;await loadApp(r.data.user)}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='Sign in'}}async function loadApp(user){me=user;let p=await client.from('staff_profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;profile=p.data;if(!profile){let admin=user.email.toLowerCase()==='info@knightsmobilebars.co.uk';let ins=await client.from('staff_profiles').insert({id:user.id,email:user.email,full_name:user.user_metadata?.full_name||user.email,registration_status:admin?'approved':'not_completed',role:admin?'admin':'staff'}).select().single();if(ins.error)throw ins.error;profile=ins.data}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='Hello, '+(profile.full_name||user.email);$('status').textContent=profile.role==='admin'?'Administrator':'Staff · '+profile.registration_status.replaceAll('_',' ');$('adminTab').classList.toggle('hidden',profile.role!=='admin');if(profile.role==='admin'){await loadManagers();await loadAdmin()}else await loadStaff()}async function loadStaff(){if(profile.registration_status!=='approved'){$('staffGate').classList.remove('hidden');$('staffContent').innerHTML='';return}$('staffGate').classList.add('hidden');let r=await client.from('bar_events').select('*').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(r.error)throw r.error;events=r.data||[];let own=await client.from('shift_signups').select('event_id,status').eq('staff_id',me.id);if(own.error)throw own.error;let map={};(own.data||[]).forEach(x=>map[x.event_id]=x.status);$('staffContent').innerHTML=events.length?events.map(e=>`<div class="card"><div class="row"><div><div class="date">${dateFmt(e.event_date)}</div><div class="event">${esc(e.event_name)}</div></div><span class="badge">${e.staff_required} staff needed</span></div><div class="meta">📍 ${esc(e.venue)}<br>🕐 Arrival ${timeFmt(e.arrival_time)} · ${timeFmt(e.start_time)}–${timeFmt(e.finish_time)}</div><div class="manager">👑 Bar Manager: <b>${esc(e.manager_name||'Not assigned')}</b></div>${e.bar_package?`<div class="small">${esc(e.bar_package)}</div>`:''}${e.notes?`<div class="small" style="margin-top:7px">${esc(e.notes)}</div>`:''}<button class="btn ${map[e.id]?'gold':''}" type="button" onclick="requestShift('${e.id}',${!!map[e.id]})">${map[e.id]?map[e.id]==='confirmed'?'CONFIRMED':'REQUESTED':'I\'M AVAILABLE'}</button></div>`).join(''):'<div class="card"><b>No upcoming shifts yet.</b><p class="small">New events will appear here once added by Knights.</p></div>'}window.requestShift=async(id,has)=>{if(has)return;let r=await client.from('shift_signups').insert({event_id:id,staff_id:me.id,status:'pending'});if(r.error){alert(r.error.message);return}await loadStaff()};async function loadManagers(){let r=await client.from('staff_profiles').select('id,full_name,email,registration_status,role').order('full_name');if(r.error)throw r.error;$('manager').innerHTML='<option value="">Not assigned</option>'+(r.data||[]).filter(x=>x.registration_status==='approved'||x.role==='admin').map(x=>`<option value="${x.id}">${esc(x.full_name)}${x.role==='admin'?' (Admin)':''}</option>`).join('')}async function loadAdmin(){let r=await client.from('bar_events').select('*').gte('event_date',new Date().toISOString().slice(0,10)).order('event_date');if(r.error)throw r.error;events=r.data||[];let sr=await client.from('shift_signups').select('id,event_id,staff_id,status,created_at');if(sr.error)throw sr.error;let pr=await client.from('staff_profiles').select('id,full_name,email,registration_status,role').order('full_name');if(pr.error)throw pr.error;let profiles=pr.data||[],byId=Object.fromEntries(profiles.map(x=>[x.id,x])),signups=sr.data||[],active=signups.filter(x=>x.status!=='cancelled'&&x.status!=='declined');$('eventCount').textContent=events.length;$('openCount').textContent=events.filter(e=>active.filter(s=>s.event_id===e.id).length<e.staff_required).length;$('pendingCount').textContent=signups.filter(x=>x.status==='pending').length;$('adminEvents').innerHTML=events.length?events.map(e=>{let ss=signups.filter(s=>s.event_id===e.id&&s.status!=='cancelled'&&s.status!=='declined');return `<div class="card"><div class="row"><div><div class="date">${dateFmt(e.event_date)}</div><div class="event">${esc(e.event_name)}</div></div><span class="badge ${ss.length>=e.staff_required?'approved':'need'}">${ss.length}/${e.staff_required} staff</span></div><div class="meta">📍 ${esc(e.venue)}<br>🕐 Arrival ${timeFmt(e.arrival_time)} · ${timeFmt(e.start_time)}–${timeFmt(e.finish_time)}</div><div class="manager">👑 Manager: <b>${esc(e.manager_name||'Not assigned')}</b></div><div class="staffline"><b>Staff requests</b><br>${ss.length?ss.map(s=>{let p=byId[s.staff_id];return `<div style="margin-top:8px">${esc(p?.full_name||'Staff')} <span class="badge ${s.status==='confirmed'?'approved':'pending'}">${s.status}</span>${s.status==='pending'?` <button onclick="setSignup('${s.id}','confirmed')">Confirm</button> <button onclick="setSignup('${s.id}','declined')">Decline</button>`:''}</div>`}).join(''):'<span class="small">No one signed up yet.</span>'}</div></div>`}).join(''):'<div class="card"><b>No events yet.</b><p class="small">Use the form above to add your first Knights event.</p></div>';$('staffList').innerHTML=profiles.map(p=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(p.full_name)}</b><br><span class="small">${esc(p.email)} · ${esc(p.role)} · ${esc(p.registration_status.replaceAll('_',' '))}</span></div>`).join('')||'No staff yet.'}window.setSignup=async(id,status)=>{let r=await client.from('shift_signups').update({status}).eq('id',id);if(r.error){alert(r.error.message);return}await loadAdmin()};async function createEvent(){let data={event_name:$('eventName').value.trim(),event_date:$('eventDate').value,venue:$('venue').value.trim(),arrival_time:$('arrival').value||null,start_time:$('start').value||null,finish_time:$('finish').value||null,staff_required:+$('staffRequired').value||1,manager_id:$('manager').value||null,manager_name:$('manager').selectedOptions[0]?.textContent?.replace(' (Admin)','')||null,bar_package:$('barPackage').value.trim()||null,dress_code:$('dressCode').value.trim()||null,notes:$('notes').value.trim()||null};if(!data.event_name||!data.event_date||!data.venue)return adminMsg('Add an event name, date and venue.');let b=$('createEventBtn');b.disabled=true;b.textContent='Adding…';try{let r=await client.from('bar_events').insert(data);if(r.error)throw r.error;['eventName','eventDate','venue','arrival','start','finish','barPackage','dressCode','notes'].forEach(id=>$(id).value='');$('staffRequired').value=3;$('manager').value='';await loadAdmin()}catch(e){adminMsg(e.message)}finally{b.disabled=false;b.textContent='Add event'}}$('loginBtn').onclick=login;$('signupBtn').onclick=signup;$('createEventBtn').onclick=createEvent;$('logoutBtn').onclick=()=>client.auth.signOut().then(()=>location.reload());$('adminTab').onclick=()=>{$('staffView').classList.add('hidden');$('adminView').classList.remove('hidden');$('staffTab').classList.remove('active');$('adminTab').classList.add('active')};$('staffTab').onclick=()=>{$('adminView').classList.add('hidden');$('staffView').classList.remove('hidden');$('adminTab').classList.remove('active');$('staffTab').classList.add('active');if(profile?.role==='admin')loadStaff()};client.auth.getSession().then(x=>x.data.session&&loadApp(x.data.session.user).catch(e=>msg(e.message))).catch(e=>msg(e.message))})();</script></body></html>
