<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171716"><title>Knights Staff</title><style>:root{--ink:#171716;--cream:#f6f1e8;--paper:#fffdf9;--gold:#b59a63;--muted:#777166;--line:#e5ddd0;--red:#9a4b42;--green:#3d7558}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:28px 18px 70px}.head{background:var(--ink);color:#fff;border-radius:20px;padding:28px 22px;margin-bottom:18px;text-align:center}.brand{font:36px Georgia,serif;letter-spacing:.12em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em;margin-top:7px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}.hidden{display:none!important}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd2c2;border-radius:9px;background:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;margin-top:13px;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55}.gold{background:var(--gold)}.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.link{display:block;width:100%;border:0;background:transparent;color:var(--ink);font-weight:700;padding:14px 0 3px;cursor:pointer}.msg{min-height:24px;margin:14px 0 0;white-space:pre-line;line-height:1.45}.error{color:var(--red)}.success{color:var(--green)}.notice{padding:12px;border-radius:10px;background:#f8f0df;border:1px solid #e7d5ac;font-size:13px;line-height:1.45;margin-bottom:10px}</style></head><body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><section class="card"><div id="loginView"><h1>Knights Staff</h1><p class="muted">Sign in to view and request shifts.</p><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"><button class="btn" id="loginBtn" type="button">Sign in</button><button class="link" id="forgotBtn" type="button">Forgot your password?</button><button class="btn gold" id="createBtn" type="button">Create account</button></div><div id="forgotView" class="hidden"><h1>Reset your password</h1><p class="muted">Enter your Knights account email and we'll send you a secure reset link.</p><label>Email</label><input id="resetEmail" type="email" autocomplete="email"><button class="btn gold" id="sendResetBtn" type="button">Send reset email</button><button class="btn light" id="backBtn" type="button">Back to sign in</button></div><div id="recoveryView" class="hidden"><h1>Choose a new password</h1><div class="notice">Use at least 8 characters.</div><label>New password</label><input id="newPassword" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password"><button class="btn gold" id="updatePasswordBtn" type="button">Update password</button></div><p id="msg" class="msg"></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(function(){const URL='https://jpjrsndbjklecvwiuvbf.supabase.co',KEY='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7',APP='staffing-v2-core.html?build=20260830-1430',db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);function show(id){['loginView','forgotView','recoveryView'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('msg').textContent='';$('msg').className='msg'}function report(e,area){const r=String(e?.message||e||''),l=r.toLowerCase();let c='KN-SYSTEM-001',t='We could not complete that action. Please try again.';if(l.includes('invalid login credentials')){c='KN-AUTH-001';t='The email or password is incorrect.'}else if(l.includes('email not confirmed')){c='KN-AUTH-002';t='Please verify your email address before signing in.'}else if(l.includes('rate limit')||l.includes('too many')){c='KN-AUTH-003';t='Too many sign-in attempts. Please wait a few minutes and try again.'}else if(l.includes('network')||l.includes('fetch')){c='KN-SYSTEM-002';t='We could not connect to Knights. Check your connection and try again.'}else if(area==='PROFILE'){c='KN-PROFILE-001';t='Login succeeded, but your staff profile could not be loaded.'}else if(area==='DATA'){c='KN-DATA-001';t='Login succeeded, but your shifts could not be loaded.'}console.error(c,e);return t+'\nError code: '+c}async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return setMsg('Enter your email and password.');$('loginBtn').disabled=true;setMsg('Signing in…','success');try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.user?.id)throw new Error('Authentication succeeded without a user id');location.replace(APP)}catch(e){setMsg(report(e,'AUTH'))}finally{$('loginBtn').disabled=false}}async function reset(){const email=$('resetEmail').value.trim().toLowerCase();if(!email)return setMsg('Enter your email address.');$('sendResetBtn').disabled=true;setMsg('Sending reset email…','success');try{const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});if(r.error)throw r.error;setMsg('If that email is registered with Knights, a password reset link has been sent. Check your inbox and spam/junk.','success')}catch(e){setMsg(report(e,'AUTH'))}finally{$('sendResetBtn').disabled=false}}async function updatePassword(){const a=$('newPassword').value,b=$('confirmPassword').value;if(a.length<8)return setMsg('Your new password must be at least 8 characters.');if(a!==b)return setMsg('The passwords do not match.');$('updatePasswordBtn').disabled=true;setMsg('Updating password…','success');try{const r=await db.auth.updateUser({password:a});if(r.error)throw r.error;setMsg('Password updated. Returning to Knights Staff…','success');setTimeout(()=>location.replace(APP),700)}catch(e){setMsg(report(e,'AUTH'))}finally{$('updatePasswordBtn').disabled=false}}function setMsg(t,type){$('msg').textContent=t;$('msg').className='msg '+(type||'error')}function wire(){$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('forgotBtn').onclick=()=>{$('resetEmail').value=$('email').value;show('forgotView')};$('backBtn').onclick=()=>show('loginView');$('sendResetBtn').onclick=reset;$('updatePasswordBtn').onclick=updatePassword;$('createBtn').onclick=()=>location.replace(APP);const h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('type')==='recovery')show('recoveryView')}if(window.supabase)wire();else setMsg('We could not start the Knights login system. Please refresh the page.\nError code: KN-SYSTEM-001')})();</script></body></html>
