<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knights Staff</title><style>body{margin:0;background:#f6f1e8;color:#171716;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.head,.card{background:#fffdf9;border:1px solid #e5ddd0;border-radius:15px;padding:18px;margin:12px 0}.head{background:#171716;color:#fff}.brand{font:28px Georgia,serif;letter-spacing:.1em}.sub{font-size:11px;color:#d8c9a6;letter-spacing:.18em}h1,h2{font-family:Georgia,serif;font-weight:500}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd2c2;border-radius:9px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#171716;color:#fff;font-weight:bold;margin-top:12px;font-size:15px}.gold{background:#b59a63}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{min-height:22px;color:#777166}.hidden{display:none!important}.lock{background:#fffaf0;border:1px solid #d9c8a1;border-radius:12px;padding:16px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="head"><div class="brand">KNIGHTS</div><div class="sub">MOBILE BARS · STAFF</div></header><section id="auth" class="card"><h1>Knights Staff</h1><p>Sign in to view and request shifts.</p><div id="nameBox" class="hidden"><label>Full name</label><input id="name" autocomplete="name"></div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="grid"><button class="btn" id="loginBtn" type="button">Sign in</button><button class="btn gold" id="signupBtn" type="button">Create account</button></div><p id="msg" class="msg"></p></section><section id="app" class="hidden"><div class="card"><h1>Welcome to Knights Staff</h1><p id="welcome"></p><button class="btn" id="logoutBtn">Log out</button></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(function(){
const URL='https://jpjrsndbjklecvwiuvbf.supabase.co';const KEY='sb_publishable_3xafRje7lv0WNnV1wkdU4Q_Yo3NYrW7';const FORM='https://forms.gle/PN2j7nMZTGgxkbP57';
const msg=t=>document.getElementById('msg').textContent=t;
let client=null;
try{if(!window.supabase||!window.supabase.createClient)throw new Error('The sign-in service did not load.');client=window.supabase.createClient(URL,KEY)}catch(e){msg(e.message);return}
async function signup(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name){document.getElementById('nameBox').classList.remove('hidden');msg('Enter your full name, then tap Create account again.');document.getElementById('name').focus();return}if(!email||!email.includes('@'))return msg('Please enter a valid email address.');if(password.length<8)return msg('Password must be at least 8 characters.');const b=document.getElementById('signupBtn');b.disabled=true;b.textContent='Creating…';msg('Creating account…');try{const r=await client.auth.signUp({email,password,options:{data:{full_name:name}}});if(r.error)throw r.error;if(r.data.user){const admin=email.toLowerCase()==='info@knightsmobilebars.co.uk';const p=await client.from('staff_profiles').upsert({id:r.data.user.id,email,full_name:name,registration_status:admin?'approved':'pending',role:admin?'admin':'staff'},{onConflict:'id'});if(p.error)throw p.error}msg(r.data.session?'Account created — signing you in…':'Account created. Check your email to confirm it, then use Sign in.')}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='Create account'}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('Enter your email and password.');const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Signing in…';msg('Signing in…');try{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('welcome').textContent='Signed in as '+email+'. The live staffing dashboard is ready for the next build step.'}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='Sign in'}}
document.getElementById('loginBtn').addEventListener('click',login);document.getElementById('signupBtn').addEventListener('click',signup);document.getElementById('logoutBtn').addEventListener('click',()=>client.auth.signOut().then(()=>location.reload()));
})();</script></body></html>
